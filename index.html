    const FishInfoUI = {
      currentId: null, _interval: null,
      open(id) {
        const f = State.fishes.find(x => x.id === id);
        if (!f) return;
        this.currentId = id;
        this.render(f);
        AquaApp.openModal('fish-info-modal');
        this._ensureTimer();
      },
      render(f) {
        document.getElementById('fish-info-name').value = f.displayName;
        const speciesName = FISH_SPECIES[f.speciesKey] ? FISH_SPECIES[f.speciesKey].name : f.speciesKey;
        document.getElementById('fish-info-species').innerHTML = `<span class="tier-${f.tier}">${f.tier}</span> · ${speciesName}`;
        document.getElementById('fish-info-genetics').innerHTML = `색상 ${f.genotype.color.join('')} · 무늬 ${f.genotype.pattern.join('')} (${f.traitLabel})`;
        const elapsed = Date.now() - f.birthTime;
        const stage = f.isAdult ? '성체' : '치어';
        const remain = Math.max(0, MATURITY_MS - elapsed);
        document.getElementById('fish-info-age').innerHTML = `${stage} (경과 ${formatDuration(elapsed)})` + (f.isAdult ? '' : ` · 성체까지 ${formatDuration(remain)}`);
        document.getElementById('fish-info-condition').innerText = `${Math.round(f.hunger)}%` + (f.sick ? ' · 🤒 병에 걸림' : '');
        document.getElementById('fish-info-price').innerText = `₩${f.value.toLocaleString()}`;
      },
      saveName() {
        const f = State.fishes.find(x => x.id === this.currentId);
        if (!f) return;
        const val = document.getElementById('fish-info-name').value.trim();
        f.customName = (val && val !== f.name) ? val : null;
        AquaApp.saveLocal();
        FishListUI.renderIfOpen();
      },
      _ensureTimer() {
        if (this._interval) return;
        this._interval = setInterval(() => {
          const modal = document.getElementById('fish-info-modal');
          const f = State.fishes.find(x => x.id === this.currentId);
          if (!modal.classList.contains('active') || !f) { clearInterval(this._interval); this._interval = null; return; }
          this.render(f);
        }, 1000);
      }
    };

    const FishListUI = {
      render() {
        const c = document.getElementById('fish-list-content');
        if (State.fishes.length === 0) { c.innerHTML = '<div style="text-align:center; color:#94a3b8;">어항에 물고기가 없습니다.</div>'; return; }
        c.innerHTML = State.fishes.map(f => {
          const stage = f.isAdult ? '성체' : '치어';
          return `<div class="list-item" style="cursor:pointer;" onclick="FishListUI.openDetail('${f.id}')">
            <div>
              <span class="tier-${f.tier}">${f.displayName}</span>
              <div class="cond-text">${stage} · 컨디션 ${Math.round(f.hunger)}%${f.sick ? ' · 🤒' : ''}</div>
            </div>
            <span style="color:var(--text-muted); font-size:12px;">₩${f.value.toLocaleString()}</span>
          </div>`;
        }).join('');
      },
      open() {
        this.render();
        AquaApp.openModal('fish-list-modal');
      },
      openDetail(id) {
        AquaApp.closeModal('fish-list-modal');
        FishInfoUI.open(id);
      },
      renderIfOpen() {
        if (document.getElementById('fish-list-modal').classList.contains('active')) this.render();
      }
    };

    // Click a fish in the tank to open its info popup; tapping empty water instead
    // startles the whole school, like knocking on the glass (ignored while placing/editing decorations)
    window.addEventListener('click', e => {
      if (Builder.active || DecoEditor.active) return;
      if (e.target.id !== 'webgl-canvas') return;
      const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
      const ray = new THREE.Raycaster();
      ray.setFromCamera(mouse, camera);
      const hits = ray.intersectObjects(State.fishes.map(f => f.group), true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData.fishId) obj = obj.parent;
        if (obj) { FishInfoUI.open(obj.userData.fishId); return; }
      }
      const tapHit = ray.intersectObjects([sandMesh, ...glassPanels])[0];
      const tapPoint = tapHit ? tapHit.point : new THREE.Vector3(0, 0, 0);
      Sound.init(); Sound.thud();
      State.fishes.forEach(f => f.startle(tapPoint));
    });

    /* ==========================================================
       7. AUCTION SYSTEM
       ========================================================== */
    const AUCTION_ELIGIBLE_TIERS = ['Rare', 'Epic', 'Legendary'];
    const AuctionUI = {
      bidTimeout: null, tickInterval: null,

      render() {
        const c = document.getElementById('tab-auction-content');
        if (!c) return;
        if (!State.auction) {
          const eligible = State.fishes.filter(f => AUCTION_ELIGIBLE_TIERS.includes(f.tier));
          c.innerHTML = eligible.length === 0
            ? `<div style="text-align:center; padding:20px; color:var(--text-muted);">희귀(Rare) 등급 이상 물고기만 출품할 수 있습니다.</div>`
            : eligible.map(f => `
              <div class="list-item">
                <span class="tier-${f.tier}">${f.displayName}</span>
                <button class="btn-glass btn-purple" onclick="AuctionUI.list('${f.id}')">출품 (시작가 ₩${f.value.toLocaleString()})</button>
              </div>`).join('');
          return;
        }
        const a = State.auction;
        const remain = Math.max(0, a.endsAt - Date.now());
        const mm = String(Math.floor(remain/60000)).padStart(2,'0');
        const ss = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
        c.innerHTML = `
          <div class="prediction-box">
            <b class="tier-${a.fishSnapshot.tier}">${a.fishSnapshot.name}</b> 경매 진행 중<br>
            현재 최고가: <span style="color:var(--accent-gold)">₩${a.currentBid.toLocaleString()}</span> ${a.bidder==='npc' ? '(NPC 입찰)' : '(입찰 대기 중)'}<br>
            남은 시간: <span id="auction-timer">${mm}:${ss}</span>
          </div>
          ${a.bidder ? `<button class="btn-glass btn-gold" style="padding:12px; justify-content:center;" onclick="AuctionUI.resolve()">₩${a.currentBid.toLocaleString()}에 즉시 낙찰 수락</button>` : `<div style="text-align:center; color:var(--text-muted); font-size:12px;">아직 입찰이 없습니다. 잠시 기다려보세요...</div>`}
          <div style="max-height:80px; overflow-y:auto; font-size:12px; color:var(--text-muted);">
            ${a.history.slice().reverse().map(h=>`NPC 입찰: ₩${h.amount.toLocaleString()}`).join('<br>') || '입찰 기록 없음'}
          </div>
        `;
        this._ensureTimer();
      },

      list(fishId) {
        const idx = State.fishes.findIndex(f=>f.id===fishId);
        if (idx===-1) return;
        const f = State.fishes[idx];
        if (!AUCTION_ELIGIBLE_TIERS.includes(f.tier)) return;
        f.destroy();
        State.fishes.splice(idx,1);
        State.auction = {
          fishSnapshot: { speciesKey: f.speciesKey, genotype: f.genotype, hunger: f.hunger, purchaseCost: f.purchaseCost, name: f.displayName, tier: f.tier, birthTime: f.birthTime, customName: f.customName },
          currentBid: f.value, bidder: null,
          history: [], endsAt: Date.now() + 60000
        };
        AquaApp.updateUI(); AquaApp.saveLocal();
        this.render(); this._startNpcBidding();
      },

      _startNpcBidding() {
        clearTimeout(this.bidTimeout);
        const scheduleNext = () => {
          if (!State.auction) return;
          const delay = 4000 + Math.random()*4000;
          this.bidTimeout = setTimeout(() => {
            if (!State.auction) return;
            if (Date.now() >= State.auction.endsAt) return;
            if (Math.random() < 0.7) {
              const inc = 1.05 + Math.random()*0.15;
              State.auction.currentBid = Math.round(State.auction.currentBid * inc);
              State.auction.bidder = 'npc';
              State.auction.history.push({ bidder: 'npc', amount: State.auction.currentBid, t: Date.now() });
              if (State.auction.endsAt - Date.now() < 10000) State.auction.endsAt = Date.now() + 10000;
              Sound.coin();
              AquaApp.saveLocal();
              this.render();
            }
            scheduleNext();
          }, delay);
        };
        scheduleNext();
      },

      _ensureTimer() {
        if (this.tickInterval) return;
        this.tickInterval = setInterval(() => {
          if (!State.auction) { clearInterval(this.tickInterval); this.tickInterval = null; return; }
          if (Date.now() >= State.auction.endsAt) { this.resolve(); return; }
          const el = document.getElementById('auction-timer');
          if (el) {
            const remain = Math.max(0, State.auction.endsAt - Date.now());
            const mm = String(Math.floor(remain/60000)).padStart(2,'0');
            const ss = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
            el.innerText = `${mm}:${ss}`;
          }
        }, 500);
      },

      resolve() {
        const a = State.auction;
        if (!a) return;
        clearTimeout(this.bidTimeout); this.bidTimeout = null;
        if (this.tickInterval) { clearInterval(this.tickInterval); this.tickInterval = null; }
        if (a.bidder === 'npc') {
          State.money += a.currentBid;
          Sound.coin();
          alert(`🎉 경매 낙찰! ₩${a.currentBid.toLocaleString()} 획득!`);
        } else {
          State.fishes.push(new Fish(a.fishSnapshot.speciesKey, { hunger: a.fishSnapshot.hunger, purchaseCost: a.fishSnapshot.purchaseCost, birthTime: a.fishSnapshot.birthTime, customName: a.fishSnapshot.customName, genotype: a.fishSnapshot.genotype }));
          alert('입찰자가 없어 유찰되었습니다. 물고기가 반환됩니다.');
        }
        State.auction = null;
        AquaApp.updateUI(); AquaApp.saveLocal();
        this.render();
      },

      resume() {
        if (!State.auction) return;
        if (Date.now() >= State.auction.endsAt) {
          this.resolve();
        } else {
          this._startNpcBidding();
        }
        this.render();
      }
    };

    /* ==========================================================
       8. MAIN APP CONTROLLER (Save/Load/UI)
       ========================================================== */
    const AquaApp = {
      init() {
        initThree(); this.loadLocal();
        if(State.fishes.length===0 && !State.auction) { State.fishes.push(new Fish('GUPPY', { birthTime: Date.now() }), new Fish('GUPPY', { birthTime: Date.now() })); }
        State.decorations.forEach(d => Builder.spawn(d));
        this.updateUI();
        AuctionUI.resume();
        NaturalBreeding.start();
        WaterSystem.start();

        const animate = () => {
          requestAnimationFrame(animate);
          State.fishes.forEach(f => f.update(State.foods));

          for(let i=State.foods.length-1; i>=0; i--) {
             const food = State.foods[i];
             food.vy = Math.max(food.vy - 0.0025, -0.02);
             food.mesh.position.y += food.vy;
             food.mesh.position.x += Math.sin(Date.now()*0.002 + food.driftPhase)*0.004;
             food.mesh.position.z += Math.cos(Date.now()*0.0017 + food.driftPhase)*0.004;
             if(food.mesh.position.y < -tankY+0.05) {
               // Uneaten food settles as waste instead of vanishing, and pollutes the water over time
               food.mesh.position.y = -tankY+0.05;
               if (State.waste.length < 40) {
                 food.mesh.material.color.set(0x3f2e1e);
                 State.waste.push({ mesh: food.mesh, vy: 0 });
               } else {
                 scene.remove(food.mesh);
               }
               State.foods.splice(i,1);
             }
          }

          // Waste particles sink and settle on the floor until a water change clears them
          State.waste.forEach(w => {
            w.vy = Math.max((w.vy||0) - 0.001, -0.01);
            w.mesh.position.y = Math.max(w.mesh.position.y + w.vy, -tankY+0.05);
          });

          // Fish that starved or succumbed to disease are removed here (outside the per-fish update loop)
          for (let i = State.fishes.length-1; i>=0; i--) {
            const f = State.fishes[i];
            if (f._pendingDeath) {
              showToast(`🪦 ${f.displayName}이(가) ${f._pendingDeath === 'starvation' ? '굶주림' : '질병'}으로 세상을 떠났습니다.`);
              f.destroy();
              State.fishes.splice(i, 1);
              AquaApp.updateUI(); AquaApp.saveLocal();
            }
          }

          updateDecorations();
          if (window._shimmerLight) window._shimmerLight.intensity = 0.6 + Math.sin(Date.now()*0.0005)*0.15;

          renderer.render(scene, camera);
        };
        animate();

        // ESC Key to close modals/build/edit modes
        window.addEventListener('keydown', e => {
           if(e.key === 'Escape') {
              if(Builder.active) Builder.cancel();
              if(DecoEditor.active) { DecoEditor.active = false; document.getElementById('deco-edit-banner').style.display = 'none'; }
              document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
           }
        });

        // Auto Save
        setInterval(() => this.saveLocal(), 5000);
      },

      feedFish() {
        Sound.init(); Sound.bubble();
        for(let i=0; i<3; i++) {
          const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({color:0xf59e0b}));
          mesh.position.set((Math.random()-0.5)*8, tankY-0.3, (Math.random()-0.5)*4);
          scene.add(mesh);
          State.foods.push({ mesh, vy: 0, driftPhase: Math.random()*Math.PI*2 });
        }
      },

      /* Bulk starter fish purchase */
      openBuyModal() {
        const sel = document.getElementById('buy-species');
        if (!sel.options.length) {
          sel.innerHTML = Object.entries(FISH_SPECIES).map(([key, s]) =>
            `<option value="${key}">${s.name} (마리당 ₩${s.basePrice.toLocaleString()})</option>`
          ).join('');
        }
        document.getElementById('buy-qty').value = 1;
        this.updateBuyPreview();
        this.openModal('buy-modal');
      },
      updateBuyPreview() {
        const speciesKey = document.getElementById('buy-species').value;
        const price = FISH_SPECIES[speciesKey].basePrice;
        const qty = parseInt(document.getElementById('buy-qty').value) || 0;
        const capacityLeft = State.tankCapacity - State.fishes.length;
        const maxAffordable = Math.floor(State.money/price);
        const actual = Math.max(0, Math.min(qty, capacityLeft, maxAffordable));
        let warn = '';
        if (qty > actual) warn = `<br><span style="color:var(--accent-red)">자금/수용량 한도로 ${actual}마리만 구매 가능합니다.</span>`;
        document.getElementById('buy-summary').innerHTML = `마리당 ₩${price.toLocaleString()} · 총 비용: ₩${(actual*price).toLocaleString()} · 남은 자리: ${capacityLeft}${warn}`;
      },
      confirmBulkBuy() {
        const speciesKey = document.getElementById('buy-species').value;
        const price = FISH_SPECIES[speciesKey].basePrice;
        const qty = parseInt(document.getElementById('buy-qty').value) || 0;
        const capacityLeft = State.tankCapacity - State.fishes.length;
        const maxAffordable = Math.floor(State.money/price);
        const actual = Math.max(0, Math.min(qty, capacityLeft, maxAffordable));
        if (actual <= 0) { alert('구매할 수 없습니다. 자금 또는 수조 여유를 확인하세요.'); return; }
        Sound.init(); Sound.coin();
        for (let i=0; i<actual; i++) {
          State.money -= price;
          State.fishes.push(new Fish(speciesKey, { purchaseCost: price, birthTime: Date.now() }));
        }
        this.updateUI(); this.saveLocal(); this.closeModal('buy-modal');
      },

      /* UI & Modals */
      openModal(id) { document.getElementById(id).classList.add('active'); },
      openTradeModal() {
        this.renderSellList();
        AuctionUI.render();
        document.getElementById('trade-modal').classList.add('active');
      },
      openShopModal() {
        const list = document.getElementById('shop-list');
        list.innerHTML = SHOP_DB.map(i => `
          <div class="list-item">
            <div><b>${i.name}</b></div>
            <button class="btn-glass btn-green" onclick="AquaApp.buyShop('${i.id}')">₩${i.price.toLocaleString()}</button>
          </div>
        `).join('');
        document.getElementById('shop-modal').classList.add('active');
      },
      closeModal(id) { document.getElementById(id).classList.remove('active'); },
      closeOutside(e, id) { if(e.target.id === id) this.closeModal(id); },

      buyShop(id) {
        const item = SHOP_DB.find(i=>i.id===id);
        if(State.money < item.price) return alert("잔액 부족!");
        if(item.type==='up') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.tankCapacity+=5;
          alert("수조 용량 증가!"); this.updateUI(); this.saveLocal();
        } else if(item.type==='floor-style') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.floorStyle = item.styleId;
          applyFloorStyle(State.floorStyle); this.updateUI(); this.saveLocal(); this.closeModal('shop-modal');
        } else if(item.type==='bg-style') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.bgStyle = item.styleId;
          applyBgStyle(State.bgStyle); this.updateUI(); this.saveLocal(); this.closeModal('shop-modal');
        } else {
          Builder.start(item);
        }
      },

      /* Tabs Logic */
      switchTab(tab) {
        document.getElementById('tab-btn-sell').classList.toggle('active', tab==='sell');
        document.getElementById('tab-btn-auction').classList.toggle('active', tab==='auction');
        document.getElementById('tab-sell-content').classList.toggle('active', tab==='sell');
        document.getElementById('tab-auction-content').classList.toggle('active', tab==='auction');
        if (tab === 'auction') AuctionUI.render();
      },
      conditionFactor(fish) { return 0.6 + 0.2 * (fish.hunger/100); },
      renderSellList() {
        const c = document.getElementById('tab-sell-content');
        if(State.fishes.length===0) { c.innerHTML = '<div style="text-align:center; color:#94a3b8;">판매할 물고기가 없습니다.</div>'; return; }
        c.innerHTML = State.fishes.map(f => {
          const price = Math.round(f.purchaseCost * this.conditionFactor(f));
          return `
          <div class="list-item">
            <div>
              <span class="tier-${f.tier}">${f.displayName}</span>
              <div class="cond-text">컨디션: ${Math.round(f.hunger)}%</div>
            </div>
            <button class="btn-glass btn-gold" onclick="AquaApp.sellFish('${f.id}')">₩${price.toLocaleString()} 판매</button>
          </div>`;
        }).join('');
      },
      sellFish(id) {
        const idx = State.fishes.findIndex(f=>f.id===id);
        if(idx > -1) {
           const f = State.fishes[idx];
           const price = Math.round(f.purchaseCost * this.conditionFactor(f));
           Sound.init(); Sound.coin();
           State.money += price;
           f.destroy();
           State.fishes.splice(idx,1);
           this.updateUI(); this.renderSellList(); this.saveLocal();
        }
      },

      updateUI() {
        document.getElementById('stat-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('stat-fish-count').innerText = `${State.fishes.length} / ${State.tankCapacity}`;
      },

      /* Robust Save/Load with v4 -> v5 -> v6 migration */
      saveLocal() {
        const data = {
          version: 6,
          money: State.money, tankCapacity: State.tankCapacity,
          fishes: State.fishes.map(f => ({ speciesKey: f.speciesKey, genotype: f.genotype, hunger: f.hunger, purchaseCost: f.purchaseCost, id: f.id, birthTime: f.birthTime, customName: f.customName, sick: f.sick, sickTimer: f.sickTimer })),
          decorations: State.decorations,
          floorStyle: State.floorStyle,
          bgStyle: State.bgStyle,
          auction: State.auction,
          water: State.water
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      },
      loadLocal() {
        let data = null;
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          try { data = JSON.parse(raw); } catch(e) { console.error("Save load failed", e); }
        } else {
          const v5raw = localStorage.getItem(LEGACY_SAVE_KEY_V5);
          if (v5raw) {
            try {
              const d = JSON.parse(v5raw);
              data = {
                money: d.money, tankCapacity: d.tankCapacity,
                fishes: (d.fishes||[]).map(fd => {
                  const legacy = LEGACY_GENE_TO_SPECIES[fd.geneKey] || LEGACY_GENE_TO_SPECIES.BLUE;
                  return { speciesKey: legacy.speciesKey, genotype: legacy.genotype, hunger: fd.hunger, purchaseCost: fd.purchaseCost, id: fd.id, birthTime: fd.birthTime, customName: fd.customName };
                }),
                decorations: d.decorations || [],
                floorStyle: d.floorStyle || 'default', bgStyle: d.bgStyle || 'default',
                auction: null // v5 auctions were geneKey-based and don't map cleanly; drop any in-flight listing
              };
            } catch(e) { console.error("v5 save load failed", e); }
          } else {
            const v4raw = localStorage.getItem(LEGACY_SAVE_KEY_V4);
            if (v4raw) {
              try {
                const d = JSON.parse(v4raw);
                data = {
                  money: d.money, tankCapacity: d.tankCapacity,
                  fishes: (d.fishes||[]).map(gene => {
                    const legacy = LEGACY_GENE_TO_SPECIES[gene] || LEGACY_GENE_TO_SPECIES.BLUE;
                    return { speciesKey: legacy.speciesKey, genotype: legacy.genotype, hunger: 100 };
                  }),
                  decorations: (d.decorations||[]).map(dec => ({ ...dec, id: Math.random().toString(36).substr(2,9), surface: 'floor', rotationY: 0 })),
                  floorStyle: 'default', bgStyle: 'default', auction: null
                };
              } catch(e) { console.error("v4 save load failed", e); }
            }
          }
        }
        if (!data) return;
        State.money = data.money || 35000;
        State.tankCapacity = data.tankCapacity || 8;
        State.decorations = data.decorations || [];
        State.floorStyle = data.floorStyle || 'default';
        State.bgStyle = data.bgStyle || 'default';
        State.auction = data.auction || null;
        State.water = data.water || { quality: 100, ph: 7.0 };
        if (data.fishes && data.fishes.length>0) {
          data.fishes.forEach(fd => State.fishes.push(new Fish(fd.speciesKey, fd)));
        }
      },

      confirmResetGame() {
        if (confirm('정말 게임을 처음부터 새로 시작할까요?\n현재 진행 상황(자산, 물고기, 인테리어)이 모두 사라지며 되돌릴 수 없습니다.')) {
          this.resetGame();
        }
      },
      resetGame() {
        clearTimeout(AuctionUI.bidTimeout); AuctionUI.bidTimeout = null;
        if (AuctionUI.tickInterval) { clearInterval(AuctionUI.tickInterval); AuctionUI.tickInterval = null; }
        NaturalBreeding.stop();
        WaterSystem.stop();

        State.fishes.forEach(f => f.destroy());
        State.fishes = [];
        State.foods.forEach(f => scene.remove(f.mesh));
        State.foods = [];
        State.waste.forEach(w => scene.remove(w.mesh));
        State.waste = [];
        State.decorations.forEach(d => { const m = sceneFindByDecoId(d.id); if (m) scene.remove(m); });
        State.decorations = [];
        State.money = 35000;
        State.tankCapacity = 8;
        State.floorStyle = 'default';
        State.bgStyle = 'default';
        State.auction = null;
        State.water = { quality: 100, ph: 7.0 };

        applyFloorStyle(State.floorStyle);
        applyBgStyle(State.bgStyle);

        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(LEGACY_SAVE_KEY_V5);
        localStorage.removeItem(LEGACY_SAVE_KEY_V4);

        State.fishes.push(new Fish('GUPPY', { birthTime: Date.now() }), new Fish('GUPPY', { birthTime: Date.now() }));
        this.updateUI();
        this.saveLocal();
        NaturalBreeding.start();
        WaterSystem.start();
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      }
    };
    window.addEventListener('DOMContentLoaded', () => AquaApp.init());
  </script>
</body>
