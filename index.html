<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AquaBreeder Tycoon - Realistic 3D Species Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.15);
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #050b14;
      color: var(--text-main);
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .interactive {
      pointer-events: auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .stat-badge span.val {
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 15px;
    }
    .badge-gold span.val {
      color: var(--accent-gold);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    button.btn-glass {
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button.btn-glass:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    button.btn-glass:active {
      transform: translateY(1px);
    }
    button.btn-primary {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
    }
    button.btn-gold {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .main-action-btn {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 16px;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .fish-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .fish-badge-tier {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tier-common { background: #334155; color: #cbd5e1; }
    .tier-rare { background: #0369a1; color: #7dd3fc; }
    .tier-epic { background: #6d28d9; color: #d8b4fe; }
    .tier-legendary { background: #b45309; color: #fef08a; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }

    .auction-active-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 18px;
      position: relative;
    }
    .bid-timer {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 13px;
      color: var(--accent-red);
      font-weight: 700;
    }
    .bid-log {
      max-height: 120px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
    }

    body.mode-widget .header-bar,
    body.mode-widget .bottom-bar {
      display: none !important;
    }
    .widget-panel {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 10px 14px;
      gap: 10px;
      align-items: center;
      z-index: 50;
    }
    body.mode-widget .widget-panel {
      display: flex !important;
    }
    body.stealth-hidden {
      opacity: 0.05 !important;
      pointer-events: none !important;
    }
    .sync-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px dashed var(--border-glass);
      color: #38bdf8;
    }
    textarea.sync-input {
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      color: #fff;
      padding: 8px;
      font-size: 12px;
      resize: none;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer" id="ui-layer">
    <header class="header-bar interactive">
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="stat-badge badge-gold">
          <span>자산:</span>
          <span class="val" id="stat-money">₩ 25,000</span>
        </div>
        <div class="stat-badge">
          <span>수조 개체:</span>
          <span class="val" id="stat-fish-count">0 / 8</span>
        </div>
        <div class="stat-badge">
          <span>수질:</span>
          <span class="val" id="stat-clean">98%</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn-glass" onclick="AquaApp.toggleWidgetMode()">
          <span>🪟</span> 위젯 모드
        </button>
        <button class="btn-glass" onclick="AquaApp.openSyncModal()">
          <span>☁️</span> 모바일 연동
        </button>
        <button class="btn-glass btn-gold" onclick="AquaApp.openAuctionModal()">
          <span>🏛️</span> 실시간 경매장
        </button>
      </div>
    </header>

    <footer class="bottom-bar interactive">
      <button class="btn-glass btn-primary main-action-btn" onclick="AquaApp.feedFish()">
        <span>🦐</span> 밥 주기 (Feed)
      </button>
      <button class="btn-glass main-action-btn" onclick="AquaApp.cleanTank()">
        <span>🧼</span> 환수 (Clean)
      </button>
      <button class="btn-glass main-action-btn" onclick="AquaApp.buyStarterFish()">
        <span>➕</span> 치어 분양 (₩5,000)
      </button>
    </footer>

    <div class="widget-panel interactive">
      <span style="font-size: 13px; font-weight: 700; color: #38bdf8;" id="widget-money">₩ 25,000</span>
      <span style="font-size: 12px; color: #94a3b8;" id="widget-status">수질 98%</span>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.feedFish()">🦐 먹이</button>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.cleanTank()">🧼 환수</button>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.toggleWidgetMode()">⛶ 전체화면</button>
    </div>
  </div>

  <!-- AUCTION MODAL -->
  <div class="modal-overlay" id="auction-modal">
    <div class="modal-card interactive">
      <div class="modal-header">
        <h3>🏛️ 브리더 경매장</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('auction-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div id="active-auction-container"></div>
        <h4 style="font-size: 14px; margin-top: 6px;">내 어항의 성어 목록 (출품 가능)</h4>
        <div id="auction-fish-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </div>
  </div>

  <!-- SYNC MODAL -->
  <div class="modal-overlay" id="sync-modal">
    <div class="modal-card interactive">
      <div class="modal-header">
        <h3>☁️ PC ↔ 모바일 동기화</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('sync-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-size: 12px; font-weight: 600; color: #38bdf8;">내 어항 동기화 코드:</label>
          <div class="sync-box" id="sync-export-code" style="margin-top: 6px;">생성 중...</div>
          <button class="btn-glass btn-primary" style="margin-top: 8px; width: 100%; justify-content: center;" onclick="AquaApp.copySyncCode()">
            📋 코드 복사
          </button>
        </div>
        <hr style="border: 0; border-top: 1px solid var(--border-glass);" />
        <div>
          <label style="font-size: 12px; font-weight: 600; color: var(--accent-gold);">다른 기기에서 불러오기:</label>
          <textarea class="sync-input" id="sync-import-code" placeholder="동기화 코드를 붙여넣으세요..." style="margin-top: 6px;"></textarea>
          <button class="btn-glass btn-gold" style="margin-top: 8px; width: 100%; justify-content: center;" onclick="AquaApp.importSyncCode()">
            🔄 데이터 불러오기
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. GAME STATE & AUDIO
       ========================================================== */
    const State = {
      money: 25000,
      tankCapacity: 8,
      cleanliness: 100,
      fishes: [],
      foods: [],
      activeAuction: null,
      isWidgetMode: false,
      isStealth: false
    };

    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      bubble() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.11);
      },
      coin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1318, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.31);
      }
    };

    /* ==========================================================
       2. THREE.JS 3D SCENE & AQUARIUM
       ========================================================== */
    let scene, camera, renderer, tankBounds;
    const canvas = document.getElementById('webgl-canvas');

    function initThree() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x061826, 0.03);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.5, 13);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xcdeafe, 1.1);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xe0f2fe, 1.3);
      mainLight.position.set(2, 9, 4);
      scene.add(mainLight);

      // Tank Bounds
      tankBounds = { x: 5.8, y: 3.4, z: 2.8 };

      // Tank Edges Frame
      const tankGeo = new THREE.BoxGeometry(tankBounds.x * 2, tankBounds.y * 2, tankBounds.z * 2);
      const edges = new THREE.EdgesGeometry(tankGeo);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
      scene.add(new THREE.LineSegments(edges, lineMat));

      // Tank Sand Substrate
      const sandGeo = new THREE.PlaneGeometry(tankBounds.x * 2, tankBounds.z * 2);
      const sandMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
      const sand = new THREE.Mesh(sandGeo, sandMat);
      sand.rotation.x = -Math.PI / 2;
      sand.position.y = -tankBounds.y;
      scene.add(sand);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ==========================================================
       3. 5 DISTINCT SPECIES DEFINITION & REALISTIC PROCEDURAL 3D
       ========================================================== */
    const SPECIES_CONFIG = [
      {
        species: "네온 테트라 (Neon Tetra)",
        type: "TETRA",
        bodyColor: 0x0284c7, // Neon Cyan
        stripeColor: 0xef4444, // Neon Red
        finColor: 0xffffff,
        rarity: 1,
        bodyScale: [0.35, 0.45, 1.0], // Slender torpedo
        speed: 0.05
      },
      {
        species: "팬시 구피 (Fancy Guppy)",
        type: "GUPPY",
        bodyColor: 0x10b981, // Emerald Green
        tailColor: 0xf59e0b, // Amber yellow fan tail
        finColor: 0xfcd34d,
        rarity: 1,
        bodyScale: [0.4, 0.5, 1.1],
        speed: 0.038
      },
      {
        species: "엔젤피쉬 (Angelfish)",
        type: "ANGEL",
        bodyColor: 0xe2e8f0, // Silver Platinum
        stripeColor: 0x1e293b, // Zebra stripes
        finColor: 0x94a3b8,
        rarity: 2,
        bodyScale: [0.2, 1.3, 1.0], // Tall diamond shape
        speed: 0.026
      },
      {
        species: "크라운 베타 (Betta Splendens)",
        type: "BETTA",
        bodyColor: 0x881337, // Deep Crimson
        tailColor: 0xec4899, // Magenta long veil
        finColor: 0xf43f5e,
        rarity: 3,
        bodyScale: [0.4, 0.65, 1.2],
        speed: 0.032
      },
      {
        species: "터콰이즈 디스커스 (Turquoise Discus)",
        type: "DISCUS",
        bodyColor: 0x06b6d4, // Vivid turquoise disc
        tailColor: 0x0891b2,
        finColor: 0x38bdf8,
        rarity: 4,
        bodyScale: [0.25, 1.4, 1.4], // Round flat disc
        speed: 0.022
      }
    ];

    class RealisticFish {
      constructor(gene = null) {
        this.id = 'fish_' + Math.random().toString(36).substr(2, 9);
        this.age = gene ? 0 : 50;
        this.hunger = 80;
        this.health = 100;

        this.gene = gene || this.generateRandomSpecies();
        this.calculateTier();

        this.group = new THREE.Group();
        this.tailPivots = [];
        this.pectoralFins = [];
        this.buildRealisticMesh();

        // Spawn position & velocity
        this.pos = new THREE.Vector3(
          (Math.random() - 0.5) * (tankBounds.x - 1.5),
          (Math.random() - 0.5) * (tankBounds.y - 1.5),
          (Math.random() - 0.5) * (tankBounds.z - 1.5)
        );
        this.vel = new THREE.Vector3(
          (Math.random() - 0.5) * this.gene.speed,
          (Math.random() - 0.5) * (this.gene.speed * 0.5),
          (Math.random() - 0.5) * this.gene.speed
        );
        this.group.position.copy(this.pos);
        scene.add(this.group);

        this.animTimer = Math.random() * 20;
      }

      generateRandomSpecies() {
        // Higher chance for Starter/Common species
        const roll = Math.random();
        let chosen;
        if (roll < 0.4) chosen = SPECIES_CONFIG[0];      // Tetra
        else if (roll < 0.7) chosen = SPECIES_CONFIG[1]; // Guppy
        else if (roll < 0.9) chosen = SPECIES_CONFIG[2]; // Angel
        else chosen = SPECIES_CONFIG[3];                 // Betta

        return {
          speciesName: chosen.species,
          type: chosen.type,
          bodyColor: chosen.bodyColor,
          tailColor: chosen.tailColor || chosen.bodyColor,
          stripeColor: chosen.stripeColor || null,
          finColor: chosen.finColor,
          rarityScore: chosen.rarity,
          bodyScale: chosen.bodyScale,
          speed: chosen.speed,
          isMutant: false
        };
      }

      calculateTier() {
        const score = this.gene.rarityScore;
        if (this.gene.isMutant || score >= 5) {
          this.tier = "Legendary";
          this.baseValue = 150000;
        } else if (score >= 4) {
          this.tier = "Epic";
          this.baseValue = 65000;
        } else if (score >= 2) {
          this.tier = "Rare";
          this.baseValue = 22000;
        } else {
          this.tier = "Common";
          this.baseValue = 6000;
        }
      }

      buildRealisticMesh() {
        while (this.group.children.length > 0) {
          this.group.remove(this.group.children[0]);
        }
        this.tailPivots = [];
        this.pectoralFins = [];

        const scaleMultiplier = THREE.MathUtils.lerp(0.35, 0.85, this.age / 100);
        const [sx, sy, sz] = this.gene.bodyScale;

        // 1. STREAMLINED FISH BODY (Sphere stretched into a realistic fish fuselage)
        const bodyGeo = new THREE.SphereGeometry(0.5, 20, 16);
        bodyGeo.scale(sx, sy, sz);

        const bodyMat = new THREE.MeshStandardMaterial({
          color: this.gene.bodyColor,
          metalness: this.gene.isMutant ? 0.85 : 0.3,
          roughness: 0.25
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        this.group.add(body);

        // 2. FISH EYES (Left & Right)
        const eyeGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
        const corneaGeo = new THREE.SphereGeometry(0.03, 8, 8);
        const corneaMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(sx * 0.42, sy * 0.15, sz * 0.35);
        const irisR = new THREE.Mesh(corneaGeo, corneaMat);
        irisR.position.set(0.04, 0.02, 0.04);
        eyeR.add(irisR);
        this.group.add(eyeR);

        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-sx * 0.42, sy * 0.15, sz * 0.35);
        const irisL = new THREE.Mesh(corneaGeo, corneaMat);
        irisL.position.set(-0.04, 0.02, 0.04);
        eyeL.add(irisL);
        this.group.add(eyeL);

        // 3. DORSAL FIN (Top)
        const dorsalGeo = new THREE.BufferGeometry();
        let dVerts;
        if (this.gene.type === "ANGEL") {
          // Extra high dorsal fin for Angelfish
          dVerts = new Float32Array([
            0, sy * 0.4, 0.1,
            0, sy * 1.8, -0.4,
            0, sy * 0.3, -0.5
          ]);
        } else {
          dVerts = new Float32Array([
            0, sy * 0.4, 0.2,
            0, sy * 1.1, -0.3,
            0, sy * 0.3, -0.6
          ]);
        }
        dorsalGeo.setAttribute('position', new THREE.BufferAttribute(dVerts, 3));
        const finMat = new THREE.MeshStandardMaterial({
          color: this.gene.finColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85,
          roughness: 0.3
        });
        const dorsal = new THREE.Mesh(dorsalGeo, finMat);
        this.group.add(dorsal);

        // 4. VENTRAL / ANAL FIN (Bottom)
        const ventralGeo = new THREE.BufferGeometry();
        let vVerts;
        if (this.gene.type === "ANGEL") {
          // Deep descending pectoral feelers
          vVerts = new Float32Array([
            0, -sy * 0.3, 0.1,
            0, -sy * 1.9, -0.2,
            0, -sy * 0.4, -0.5
          ]);
        } else {
          vVerts = new Float32Array([
            0, -sy * 0.3, 0.1,
            0, -sy * 0.9, -0.3,
            0, -sy * 0.3, -0.6
          ]);
        }
        ventralGeo.setAttribute('position', new THREE.BufferAttribute(vVerts, 3));
        const ventral = new THREE.Mesh(ventralGeo, finMat);
        this.group.add(ventral);

        // 5. TAIL FIN ASSEMBLY (Tail Peduncle + Fan Tail with Wiggle Pivot)
        const tailPivot = new THREE.Group();
        tailPivot.position.set(0, 0, -sz * 0.45); // Anchor to rear

        const tailGeo = new THREE.BufferGeometry();
        let tVerts;
        if (this.gene.type === "GUPPY" || this.gene.type === "BETTA") {
          // Large undulating fan tail
          tVerts = new Float32Array([
            0, 0, 0,
            0, sy * 1.3, -sz * 1.1,
            0, -sy * 1.3, -sz * 1.1
          ]);
        } else {
          // Classic Forked/Delta tail
          tVerts = new Float32Array([
            0, 0, 0,
            0, sy * 0.8, -sz * 0.7,
            0, 0, -sz * 0.45,
            0, 0, 0,
            0, 0, -sz * 0.45,
            0, -sy * 0.8, -sz * 0.7
          ]);
        }
        tailGeo.setAttribute('position', new THREE.BufferAttribute(tVerts, 3));
        const tailMat = new THREE.MeshStandardMaterial({
          color: this.gene.tailColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9,
          roughness: 0.3
        });
        const tailMesh = new THREE.Mesh(tailGeo, tailMat);
        tailPivot.add(tailMesh);

        this.group.add(tailPivot);
        this.tailPivots.push(tailPivot);

        this.group.scale.setScalar(scaleMultiplier);
      }

      update(delta) {
        // Growth
        if (this.age < 100) {
          this.age += delta * 1.5;
          const currentScale = THREE.MathUtils.lerp(0.35, 0.85, this.age / 100);
          this.group.scale.setScalar(currentScale);
        }

        this.hunger = Math.max(0, this.hunger - delta * 0.7);

        // Food finding
        let target = null;
        if (this.hunger < 75 && State.foods.length > 0) {
          target = State.foods[0].pos;
        }

        if (target) {
          const dir = new THREE.Vector3().subVectors(target, this.pos).normalize();
          this.vel.lerp(dir.multiplyScalar(this.gene.speed * 1.5), 0.06);

          if (this.pos.distanceTo(target) < 0.45) {
            this.hunger = Math.min(100, this.hunger + 35);
            AquaApp.consumeFood(State.foods[0]);
            Sound.bubble();
          }
        } else {
          // Cruising
          if (Math.random() < 0.025) {
            this.vel.add(new THREE.Vector3(
              (Math.random() - 0.5) * 0.015,
              (Math.random() - 0.5) * 0.008,
              (Math.random() - 0.5) * 0.015
            ));
            this.vel.clampLength(this.gene.speed * 0.5, this.gene.speed * 1.3);
          }
        }

        // Boundary bounce
        const limX = tankBounds.x - 0.7;
        const limY = tankBounds.y - 0.6;
        const limZ = tankBounds.z - 0.7;

        if (Math.abs(this.pos.x + this.vel.x) > limX) this.vel.x *= -1;
        if (Math.abs(this.pos.y + this.vel.y) > limY) this.vel.y *= -1;
        if (Math.abs(this.pos.z + this.vel.z) > limZ) this.vel.z *= -1;

        this.pos.add(this.vel);
        this.group.position.copy(this.pos);

        // Look direction (heading forward)
        const forward = this.vel.clone().normalize();
        this.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), forward);

        // Realistic Tail Sinuous Wiggle (Sine wave driven)
        this.animTimer += delta * (this.vel.length() * 260 + 4);
        const wiggle = Math.sin(this.animTimer) * 0.4;
        this.tailPivots.forEach(p => {
          p.rotation.y = wiggle;
        });
      }

      destroy() {
        scene.remove(this.group);
      }
    }

    /* ==========================================================
       4. ADVANCED BREEDING & MORPH HYBRIDIZATION
       ========================================================== */
    function attemptBreeding() {
      if (State.cleanliness < 75 || State.fishes.length >= State.tankCapacity) return;

      const adults = State.fishes.filter(f => f.age >= 90 && f.hunger >= 60);
      if (adults.length < 2) return;

      const p1 = adults[Math.floor(Math.random() * adults.length)];
      let p2 = adults[Math.floor(Math.random() * adults.length)];
      if (p1 === p2) return;

      let childGene;
      const isMutation = Math.random() < 0.08; // 8% 돌연변이

      if (isMutation) {
        // Ultra Rare Radiant Aurora Discus/Betta
        childGene = {
          speciesName: "✨ 오로라 홀로그램 (돌연변이)",
          type: "DISCUS",
          bodyColor: 0xffffff,
          tailColor: 0xa855f7,
          finColor: 0x38bdf8,
          rarityScore: 6,
          bodyScale: [0.28, 1.4, 1.3],
          speed: 0.03,
          isMutant: true
        };
      } else {
        // Cross-breed: Inherits traits from both parents
        const primaryParent = Math.random() > 0.5 ? p1 : p2;
        const secondaryParent = (primaryParent === p1) ? p2 : p1;

        childGene = {
          speciesName: primaryParent.gene.speciesName,
          type: primaryParent.gene.type,
          bodyColor: primaryParent.gene.bodyColor,
          tailColor: secondaryParent.gene.tailColor, // Mixed color inheritance!
          finColor: primaryParent.gene.finColor,
          rarityScore: Math.max(p1.gene.rarityScore, p2.gene.rarityScore),
          bodyScale: primaryParent.gene.bodyScale,
          speed: primaryParent.gene.speed,
          isMutant: false
        };
      }

      const baby = new RealisticFish(childGene);
      baby.pos.copy(p1.pos);
      State.fishes.push(baby);

      Sound.bubble();
      AquaApp.updateUI();
    }

    /* ==========================================================
       5. AUCTION SIMULATION
       ========================================================== */
    const AuctionEngine = {
      startAuction(fish) {
        const index = State.fishes.indexOf(fish);
        if (index > -1) {
          fish.destroy();
          State.fishes.splice(index, 1);
        }

        const startPrice = fish.baseValue;
        State.activeAuction = {
          fish: fish,
          currentBid: startPrice,
          highestBidder: "시작가 제시",
          timeLeft: 15,
          logs: [`[경매 시작] ${fish.gene.speciesName} (${fish.tier}) 출품. 시작가: ₩${startPrice.toLocaleString()}`]
        };

        AquaApp.renderAuctionView();
      },

      tick(delta) {
        if (!State.activeAuction) return;

        const auc = State.activeAuction;
        auc.timeLeft -= delta;

        if (Math.random() < 0.23 && auc.timeLeft > 1.2) {
          const bidders = ["도쿄_아쿠아스케이퍼", "네오_브리더99", "수족관_갤러리대표", "열대어매니아_현수", "강남_수경인테리어"];
          const bot = bidders[Math.floor(Math.random() * bidders.length)];
          const bidIncr = Math.round((auc.fish.baseValue * (0.18 + Math.random() * 0.22)) / 1000) * 1000;

          auc.currentBid += bidIncr;
          auc.highestBidder = bot;
          auc.logs.unshift(`[호가 갱신] ${bot}님이 ₩${auc.currentBid.toLocaleString()} 제시!`);
          Sound.bubble();
          AquaApp.renderAuctionView();
        }

        if (auc.timeLeft <= 0) {
          State.money += auc.currentBid;
          Sound.coin();
          alert(`🎉 경매 낙찰!\n${auc.highestBidder}님에게 ₩${auc.currentBid.toLocaleString()}에 최종 매각되었습니다.`);
          State.activeAuction = null;
          AquaApp.renderAuctionView();
          AquaApp.updateUI();
        }
      }
    };

    /* ==========================================================
       6. APP CONTROLLER
       ========================================================== */
    const AquaApp = {
      init() {
        initThree();
        this.loadLocal();
        if (State.fishes.length === 0) {
          // Start with 3 distinct fish
          State.fishes.push(new RealisticFish(SPECIES_CONFIG[0])); // Tetra
          State.fishes.push(new RealisticFish(SPECIES_CONFIG[1])); // Guppy
          State.fishes.push(new RealisticFish(SPECIES_CONFIG[2])); // Angel
        }
        this.updateUI();

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            State.isStealth = !State.isStealth;
            document.body.classList.toggle('stealth-hidden', State.isStealth);
          }
        });

        let lastTime = performance.now();
        const animate = () => {
          requestAnimationFrame(animate);
          const now = performance.now();
          const delta = (now - lastTime) / 1000;
          lastTime = now;

          State.fishes.forEach(f => f.update(delta));

          // Food physics
          for (let i = State.foods.length - 1; i >= 0; i--) {
            const food = State.foods[i];
            food.pos.y -= delta * 0.6;
            food.mesh.position.copy(food.pos);
            if (food.pos.y < -tankBounds.y) {
              scene.remove(food.mesh);
              State.foods.splice(i, 1);
            }
          }

          if (Math.random() < delta * 0.08) {
            attemptBreeding();
          }

          State.cleanliness = Math.max(10, State.cleanliness - delta * 0.12);
          AuctionEngine.tick(delta);
          renderer.render(scene, camera);
        };
        animate();

        setInterval(() => this.saveLocal(), 10000);
      },

      feedFish() {
        Sound.init();
        Sound.bubble();
        for (let i = 0; i < 4; i++) {
          const foodGeo = new THREE.SphereGeometry(0.06, 8, 8);
          const foodMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
          const mesh = new THREE.Mesh(foodGeo, foodMat);
          const pos = new THREE.Vector3(
            (Math.random() - 0.5) * (tankBounds.x - 1.2),
            tankBounds.y - 0.2,
            (Math.random() - 0.5) * (tankBounds.z - 1.2)
          );
          mesh.position.copy(pos);
          scene.add(mesh);
          State.foods.push({ mesh, pos });
        }
      },

      consumeFood(food) {
        const idx = State.foods.indexOf(food);
        if (idx > -1) {
          scene.remove(food.mesh);
          State.foods.splice(idx, 1);
        }
      },

      cleanTank() {
        Sound.init();
        Sound.bubble();
        State.cleanliness = 100;
        this.updateUI();
      },

      buyStarterFish() {
        if (State.money < 5000) {
          alert("자산이 부족합니다!");
          return;
        }
        if (State.fishes.length >= State.tankCapacity) {
          alert("수조가 가득 찼습니다!");
          return;
        }
        Sound.init();
        Sound.coin();
        State.money -= 5000;
        State.fishes.push(new RealisticFish());
        this.updateUI();
      },

      toggleWidgetMode() {
        State.isWidgetMode = !State.isWidgetMode;
        document.body.classList.toggle('mode-widget', State.isWidgetMode);
      },

      openAuctionModal() {
        this.renderAuctionView();
        document.getElementById('auction-modal').classList.add('active');
      },

      renderAuctionView() {
        const container = document.getElementById('active-auction-container');
        const list = document.getElementById('auction-fish-list');

        if (State.activeAuction) {
          const auc = State.activeAuction;
          container.innerHTML = `
            <div class="auction-active-card">
              <span class="bid-timer">남은 시간: ${Math.max(0, Math.ceil(auc.timeLeft))}초</span>
              <div style="font-size: 15px; font-weight: 700; color: #f59e0b;">${auc.fish.gene.speciesName}</div>
              <div style="font-size: 12px; color: #94a3b8;">등급: ${auc.fish.tier} | 최고 입찰자: ${auc.highestBidder}</div>
              <div style="font-size: 20px; font-weight: 800; color: #38bdf8; margin: 8px 0;">
                현재 호가: ₩ ${auc.currentBid.toLocaleString()}
              </div>
              <div class="bid-log">
                ${auc.logs.map(log => `<div>${log}</div>`).join('')}
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `<div style="padding: 14px; text-align: center; color: #64748b; font-size: 13px;">진행 중인 경매가 없습니다. 아래에서 성어를 출품하세요.</div>`;
        }

        const adults = State.fishes.filter(f => f.age >= 90);
        list.innerHTML = '';
        if (adults.length === 0) {
          list.innerHTML = `<div style="font-size: 13px; color: #64748b;">출품 가능한 성어가 없습니다. 치어를 먼저 키워주세요.</div>`;
          return;
        }

        adults.forEach(f => {
          const div = document.createElement('div');
          div.className = 'fish-card';
          div.innerHTML = `
            <div>
              <div style="font-weight: 700; font-size: 14px;">${f.gene.speciesName}</div>
              <div style="display: flex; gap: 6px; margin-top: 4px;">
                <span class="fish-badge-tier tier-${f.tier.toLowerCase()}">${f.tier}</span>
                <span style="font-size: 12px; color: #94a3b8;">감정가: ₩${f.baseValue.toLocaleString()}</span>
              </div>
            </div>
            <button class="btn-glass btn-gold" ${State.activeAuction ? 'disabled' : ''} onclick="AquaApp.submitToAuction('${f.id}')">
              경매 출품
            </button>
          `;
          list.appendChild(div);
        });
      },

      submitToAuction(fishId) {
        const fish = State.fishes.find(f => f.id === fishId);
        if (fish) {
          AuctionEngine.startAuction(fish);
        }
      },

      openSyncModal() {
        const payload = this.serializeState();
        const encoded = btoa(encodeURIComponent(payload));
        document.getElementById('sync-export-code').innerText = encoded;
        document.getElementById('sync-modal').classList.add('active');
      },

      copySyncCode() {
        const text = document.getElementById('sync-export-code').innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert("동기화 코드가 클립보드에 복사되었습니다!");
        });
      },

      importSyncCode() {
        const input = document.getElementById('sync-import-code').value.trim();
        if (!input) return;
        try {
          const decoded = decodeURIComponent(atob(input));
          this.deserializeState(decoded);
          alert("수조 데이터가 복원되었습니다!");
          this.closeModal('sync-modal');
        } catch (e) {
          alert("유효하지 않은 동기화 코드입니다.");
        }
      },

      closeModal(id) {
        document.getElementById(id).classList.remove('active');
      },

      updateUI() {
        document.getElementById('stat-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('stat-fish-count').innerText = `${State.fishes.length} / ${State.tankCapacity}`;
        document.getElementById('stat-clean').innerText = `${Math.round(State.cleanliness)}%`;

        document.getElementById('widget-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('widget-status').innerText = `수질 ${Math.round(State.cleanliness)}%`;
      },

      serializeState() {
        return JSON.stringify({
          money: State.money,
          tankCapacity: State.tankCapacity,
          cleanliness: State.cleanliness,
          fishes: State.fishes.map(f => ({
            age: f.age,
            hunger: f.hunger,
            gene: f.gene
          }))
        });
      },

      deserializeState(jsonString) {
        const data = JSON.parse(jsonString);
        State.money = data.money || 25000;
        State.tankCapacity = data.tankCapacity || 8;
        State.cleanliness = data.cleanliness || 100;

        State.fishes.forEach(f => f.destroy());
        State.fishes = [];

        if (data.fishes) {
          data.fishes.forEach(fData => {
            const fish = new RealisticFish(fData.gene);
            fish.age = fData.age;
            fish.hunger = fData.hunger;
            State.fishes.push(fish);
          });
        }
        this.updateUI();
        this.saveLocal();
      },

      saveLocal() {
        localStorage.setItem('aqua_save_v2', this.serializeState());
      },

      loadLocal() {
        const raw = localStorage.getItem('aqua_save_v2');
        if (raw) {
          try {
            this.deserializeState(raw);
          } catch (e) {
            console.error("Save load failed", e);
          }
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      AquaApp.init();
    });
  </script>
</body>
