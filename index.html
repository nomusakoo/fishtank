<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AquaBreeder Tycoon - Desktop Widget & Cloud Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.15);
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #050b14;
      color: var(--text-main);
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* GLASS UI CONTAINER */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .interactive {
      pointer-events: auto;
    }

    /* TOP BAR */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .stat-badge span.val {
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 15px;
    }
    .badge-gold span.val {
      color: var(--accent-gold);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    button.btn-glass {
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button.btn-glass:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    button.btn-glass:active {
      transform: translateY(1px);
    }
    button.btn-primary {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
    }
    button.btn-gold {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    /* BOTTOM CONTROLS */
    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .main-action-btn {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 16px;
    }

    /* FLOATING MODALS */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: modalSlide 0.3s ease;
    }
    @keyframes modalSlide {
      from { transform: scale(0.95) translateY(10px); }
      to { transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* FISH LIST & AUCTION CARDS */
    .fish-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .fish-badge-tier {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tier-common { background: #334155; color: #cbd5e1; }
    .tier-rare { background: #0369a1; color: #7dd3fc; }
    .tier-epic { background: #6d28d9; color: #d8b4fe; }
    .tier-legendary { background: #b45309; color: #fef08a; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }

    /* AUCTION LIVE BOARD */
    .auction-active-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 18px;
      position: relative;
    }
    .bid-timer {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 13px;
      color: var(--accent-red);
      font-weight: 700;
    }
    .bid-log {
      max-height: 120px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
    }

    /* WIDGET / OFFICE COMPACT MODE */
    body.mode-widget .header-bar,
    body.mode-widget .bottom-bar {
      display: none !important;
    }
    .widget-panel {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 10px 14px;
      gap: 10px;
      align-items: center;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    body.mode-widget .widget-panel {
      display: flex !important;
    }
    body.stealth-hidden {
      opacity: 0.05 !important;
      pointer-events: none !important;
    }

    /* SYNC BOX */
    .sync-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px dashed var(--border-glass);
      color: #38bdf8;
    }
    textarea.sync-input {
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      color: #fff;
      padding: 8px;
      font-size: 12px;
      resize: none;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer" id="ui-layer">
    <!-- Top Header -->
    <header class="header-bar interactive">
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="stat-badge badge-gold">
          <span>자산:</span>
          <span class="val" id="stat-money">₩ 25,000</span>
        </div>
        <div class="stat-badge">
          <span>어종 수:</span>
          <span class="val" id="stat-fish-count">0 / 6</span>
        </div>
        <div class="stat-badge">
          <span>수질:</span>
          <span class="val" id="stat-clean">98%</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn-glass" onclick="AquaApp.toggleWidgetMode()">
          <span>🪟</span> 위젯 모드
        </button>
        <button class="btn-glass" onclick="AquaApp.openSyncModal()">
          <span>☁️</span> 모바일 연동
        </button>
        <button class="btn-glass btn-gold" onclick="AquaApp.openAuctionModal()">
          <span>🏛️</span> 브리더 경매장
        </button>
      </div>
    </header>

    <!-- Bottom Actions -->
    <footer class="bottom-bar interactive">
      <button class="btn-glass btn-primary main-action-btn" onclick="AquaApp.feedFish()">
        <span>🦐</span> 밥 주기 (Feed)
      </button>
      <button class="btn-glass main-action-btn" onclick="AquaApp.cleanTank()">
        <span>🧼</span> 환수 및 수질 정화
      </button>
      <button class="btn-glass main-action-btn" onclick="AquaApp.buyStarterFish()">
        <span>➕</span> 치어 입양 (₩5,000)
      </button>
    </footer>

    <!-- Mini Office Widget Floating Box -->
    <div class="widget-panel interactive">
      <span style="font-size: 13px; font-weight: 700; color: #38bdf8;" id="widget-money">₩ 25,000</span>
      <span style="font-size: 12px; color: #94a3b8;" id="widget-status">수질 98%</span>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.feedFish()">🦐 먹이</button>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.cleanTank()">🧼 환수</button>
      <button class="btn-glass" style="padding: 6px 10px;" onclick="AquaApp.toggleWidgetMode()">⛶ 복귀</button>
    </div>
  </div>

  <!-- MODAL: AUCTION HOUSE -->
  <div class="modal-overlay" id="auction-modal">
    <div class="modal-card interactive">
      <div class="modal-header">
        <h3>🏛️ 실시간 브리더 경매장</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('auction-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted);">
          멘델 유전학으로 번식된 우수 개체를 경매에 출품하세요. 수집가 AI들이 경쟁하여 실시간 호가를 올립니다.
        </p>
        
        <div id="active-auction-container">
          <!-- Live Auction Card Rendered Here -->
        </div>

        <h4 style="font-size: 14px; margin-top: 6px;">내 어항의 성어 목록 (출품 가능)</h4>
        <div id="auction-fish-list" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Adult Fish List -->
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: CLOUD SYNC -->
  <div class="modal-overlay" id="sync-modal">
    <div class="modal-card interactive">
      <div class="modal-header">
        <h3>☁️ PC ↔ 모바일 데이터 연동</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('sync-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted);">
          현재 기기의 어항 데이터(보유 어종, 유전자, 자산, 시설)를 내보내거나, 스마트폰/다른 PC에서 코드를 입력해 동기화할 수 있습니다.
        </p>

        <div>
          <label style="font-size: 12px; font-weight: 600; color: #38bdf8;">현재 내 어항 동기화 코드 (복사하여 다른 기기에 입력):</label>
          <div class="sync-box" id="sync-export-code" style="margin-top: 6px;">코드 생성 중...</div>
          <button class="btn-glass btn-primary" style="margin-top: 8px; width: 100%; justify-content: center;" onclick="AquaApp.copySyncCode()">
            📋 동기화 코드 복사하기
          </button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-glass);" />

        <div>
          <label style="font-size: 12px; font-weight: 600; color: var(--accent-gold);">다른 기기 데이터 불러오기:</label>
          <textarea class="sync-input" id="sync-import-code" placeholder="복사한 동기화 코드를 여기에 붙여넣으세요..." style="margin-top: 6px;"></textarea>
          <button class="btn-glass btn-gold" style="margin-top: 8px; width: 100%; justify-content: center;" onclick="AquaApp.importSyncCode()">
            🔄 데이터 덮어쓰기 & 동기화
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. GAME STATE & AUDIO ENGINE
       ========================================================== */
    const State = {
      money: 25000,
      tankCapacity: 6,
      cleanliness: 100, // 0 ~ 100
      fishes: [],
      foods: [],
      activeAuction: null,
      isWidgetMode: false,
      isStealth: false
    };

    // Synthesized Audio via Web Audio API
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      bubble() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.13);
      },
      coin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1318, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.31);
      }
    };

    /* ==========================================================
       2. THREE.JS 3D AQUARIUM SETUP
       ========================================================== */
    let scene, camera, renderer, tankBounds;
    const canvas = document.getElementById('webgl-canvas');

    function initThree() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a192f, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1, 12);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xd9f0ff, 0.9);
      scene.add(ambientLight);

      const sunlight = new THREE.DirectionalLight(0xa5f3fc, 1.2);
      sunlight.position.set(0, 8, 4);
      scene.add(sunlight);

      // Glass Tank Boundaries
      tankBounds = { x: 5.5, y: 3.2, z: 2.8 };

      // Tank Outline Visualizer
      const tankGeo = new THREE.BoxGeometry(tankBounds.x * 2, tankBounds.y * 2, tankBounds.z * 2);
      const edges = new THREE.EdgesGeometry(tankGeo);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
      const tankFrame = new THREE.LineSegments(edges, lineMat);
      scene.add(tankFrame);

      // Sand Floor
      const sandGeo = new THREE.PlaneGeometry(tankBounds.x * 2, tankBounds.z * 2);
      const sandMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const sand = new THREE.Mesh(sandGeo, sandMat);
      sand.rotation.x = -Math.PI / 2;
      sand.position.y = -tankBounds.y;
      scene.add(sand);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ==========================================================
       3. FISH GENETICS & 3D PROCEDURAL FISH
       ========================================================== */
    const GENE_COLORS = [
      { name: "Cobalt Blue", hex: 0x0ea5e9, rarity: 1 },
      { name: "Ruby Sunset", hex: 0xf43f5e, rarity: 1 },
      { name: "Emerald Moss", hex: 0x10b981, rarity: 1 },
      { name: "Golden Platinum", hex: 0xf59e0b, rarity: 3 },
      { name: "Cosmic Aurora", hex: 0xa855f7, rarity: 4 },
      { name: "Hologram Shiny", hex: 0xffffff, rarity: 6 } // Mutated
    ];

    class ProceduralFish {
      constructor(gene = null) {
        this.id = 'fish_' + Math.random().toString(36).substr(2, 9);
        this.age = gene ? 0 : 40; // 0 = 치어, 100 = 완전 성어
        this.hunger = 80; // 0 ~ 100
        this.health = 100;

        // Genetics
        this.gene = gene || this.generateRandomGene();
        this.calculateTier();

        // 3D Mesh
        this.group = new THREE.Group();
        this.buildMesh();
        
        // Motion Physics
        this.pos = new THREE.Vector3(
          (Math.random() - 0.5) * (tankBounds.x - 1),
          (Math.random() - 0.5) * (tankBounds.y - 1),
          (Math.random() - 0.5) * (tankBounds.z - 1)
        );
        this.vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.04,
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.04
        );
        this.group.position.copy(this.pos);
        scene.add(this.group);

        this.tailWagTime = Math.random() * 10;
      }

      generateRandomGene() {
        const selected = GENE_COLORS[Math.floor(Math.random() * 3)]; // 기본 어종 풀
        return {
          primaryColor: selected.hex,
          name: selected.name,
          rarityScore: selected.rarity,
          finStyle: Math.random() > 0.5 ? "Veiltail" : "Standard",
          scaleShine: 0.4
        };
      }

      calculateTier() {
        const score = this.gene.rarityScore;
        if (score >= 6) {
          this.tier = "Legendary";
          this.baseValue = 120000;
        } else if (score >= 4) {
          this.tier = "Epic";
          this.baseValue = 45000;
        } else if (score >= 3) {
          this.tier = "Rare";
          this.baseValue = 18000;
        } else {
          this.tier = "Common";
          this.baseValue = 5000;
        }
      }

      buildMesh() {
        // Clear previous parts
        while (this.group.children.length > 0) {
          this.group.remove(this.group.children[0]);
        }

        const scaleMultiplier = THREE.MathUtils.lerp(0.4, 1.0, this.age / 100);

        // Body
        const bodyGeo = new THREE.ConeGeometry(0.32, 0.9, 16);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({
          color: this.gene.primaryColor,
          metalness: this.gene.rarityScore >= 4 ? 0.8 : 0.2,
          roughness: 0.3
        });
        this.body = new THREE.Mesh(bodyGeo, bodyMat);
        this.group.add(this.body);

        // Tail Fin
        const tailGeo = new THREE.BufferGeometry();
        const vertices = new Float32Array([
          0, 0, 0,
          -0.2, 0.35, -0.6,
          -0.2, -0.35, -0.6
        ]);
        tailGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        const tailMat = new THREE.MeshStandardMaterial({
          color: this.gene.primaryColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        this.tail = new THREE.Mesh(tailGeo, tailMat);
        this.tail.position.set(0, 0, -0.45);
        this.group.add(this.tail);

        this.group.scale.setScalar(scaleMultiplier);
      }

      update(delta) {
        // Growth & Aging
        if (this.age < 100) {
          this.age += delta * 1.5;
          const currentScale = THREE.MathUtils.lerp(0.4, 1.0, this.age / 100);
          this.group.scale.setScalar(currentScale);
        }

        // Hunger decay
        this.hunger = Math.max(0, this.hunger - delta * 0.8);

        // Behavior: Feed if hungry & food exists
        let target = null;
        if (this.hunger < 75 && State.foods.length > 0) {
          target = State.foods[0].pos;
        }

        if (target) {
          const dir = new THREE.Vector3().subVectors(target, this.pos).normalize();
          this.vel.lerp(dir.multiplyScalar(0.06), 0.05);

          // Eat food
          if (this.pos.distanceTo(target) < 0.4) {
            this.hunger = Math.min(100, this.hunger + 35);
            AquaApp.consumeFood(State.foods[0]);
            Sound.bubble();
          }
        } else {
          // Wander physics
          if (Math.random() < 0.03) {
            this.vel.add(new THREE.Vector3(
              (Math.random() - 0.5) * 0.015,
              (Math.random() - 0.5) * 0.008,
              (Math.random() - 0.5) * 0.015
            ));
            this.vel.clampLength(0.015, 0.045);
          }
        }

        // Boundary reflection
        const limitX = tankBounds.x - 0.6;
        const limitY = tankBounds.y - 0.6;
        const limitZ = tankBounds.z - 0.6;

        if (Math.abs(this.pos.x + this.vel.x) > limitX) this.vel.x *= -1;
        if (Math.abs(this.pos.y + this.vel.y) > limitY) this.vel.y *= -1;
        if (Math.abs(this.pos.z + this.vel.z) > limitZ) this.vel.z *= -1;

        this.pos.add(this.vel);
        this.group.position.copy(this.pos);

        // Heading rotation
        const forward = this.vel.clone().normalize();
        this.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), forward);

        // Tail Wag
        this.tailWagTime += delta * 12;
        this.tail.rotation.y = Math.sin(this.tailWagTime) * 0.35;
      }

      destroy() {
        scene.remove(this.group);
      }
    }

    /* ==========================================================
       4. BREEDING (MENDELIAN GENETICS & MUTATION)
       ========================================================== */
    function attemptBreeding() {
      // Conditions: Clean water > 75%, Space available, 2+ adult fish with high satiety
      if (State.cleanliness < 75 || State.fishes.length >= State.tankCapacity) return;

      const adults = State.fishes.filter(f => f.age >= 90 && f.hunger >= 60);
      if (adults.length < 2) return;

      // Random pair
      const p1 = adults[Math.floor(Math.random() * adults.length)];
      let p2 = adults[Math.floor(Math.random() * adults.length)];
      if (p1 === p2) return;

      // Mutation Roll (7% Chance)
      let childGene;
      const isMutation = Math.random() < 0.07;

      if (isMutation) {
        // High rarity mutant
        const mutantList = GENE_COLORS.filter(g => g.rarity >= 4);
        const chosen = mutantList[Math.floor(Math.random() * mutantList.length)];
        childGene = {
          primaryColor: chosen.hex,
          name: "✨ " + chosen.name + " (돌연변이)",
          rarityScore: chosen.rarity + 1,
          finStyle: "Veiltail",
          scaleShine: 0.9
        };
      } else {
        // Mendelian Parent Trait Inheritance
        const inheritP1 = Math.random() > 0.5;
        const parent = inheritP1 ? p1 : p2;
        childGene = {
          primaryColor: parent.gene.primaryColor,
          name: parent.gene.name,
          rarityScore: Math.max(p1.gene.rarityScore, p2.gene.rarityScore),
          finStyle: Math.random() > 0.5 ? p1.gene.finStyle : p2.gene.finStyle,
          scaleShine: parent.gene.scaleShine
        };
      }

      // Spawn Fry
      const baby = new ProceduralFish(childGene);
      baby.pos.copy(p1.pos);
      State.fishes.push(baby);

      Sound.bubble();
      AquaApp.updateUI();
    }

    /* ==========================================================
       5. REAL-TIME BIDDING & AUCTION HOUSE (NPC SIMULATION)
       ========================================================== */
    const AuctionEngine = {
      startAuction(fish) {
        // Remove from tank
        const index = State.fishes.indexOf(fish);
        if (index > -1) {
          fish.destroy();
          State.fishes.splice(index, 1);
        }

        const startPrice = fish.baseValue;
        State.activeAuction = {
          fish: fish,
          currentBid: startPrice,
          highestBidder: "경매 시작가",
          timeLeft: 15, // seconds
          logs: [`[경매 오픈] ${fish.gene.name} (${fish.tier}) 출품. 시작가: ₩${startPrice.toLocaleString()}`]
        };

        AquaApp.renderAuctionView();
      },

      tick(delta) {
        if (!State.activeAuction) return;

        const auc = State.activeAuction;
        auc.timeLeft -= delta;

        // NPC Bot Bidding Algorithm based on fish tier
        if (Math.random() < 0.22 && auc.timeLeft > 1.5) {
          const botNames = ["수족관VIP_민우", "네오_아쿠아리스트", "물멍장인87", "골드피쉬_콜렉터", "도쿄_스케이퍼"];
          const bot = botNames[Math.floor(Math.random() * botNames.length)];
          const bidIncrement = Math.round((auc.fish.baseValue * (0.15 + Math.random() * 0.25)) / 1000) * 1000;
          
          auc.currentBid += bidIncrement;
          auc.highestBidder = bot;
          auc.logs.unshift(`[입찰] ${bot}님이 ₩${auc.currentBid.toLocaleString()} 호가를 제시했습니다.`);
          Sound.bubble();
          AquaApp.renderAuctionView();
        }

        // Finalize Auction
        if (auc.timeLeft <= 0) {
          State.money += auc.currentBid;
          Sound.coin();
          alert(`🎉 경매 낙찰 완료!\n${auc.highestBidder}님에게 ₩${auc.currentBid.toLocaleString()}에 최종 낙찰되었습니다.`);
          State.activeAuction = null;
          AquaApp.renderAuctionView();
          AquaApp.updateUI();
        }
      }
    };

    /* ==========================================================
       6. APPLICATION LOGIC & CLOUD SYNC
       ========================================================== */
    const AquaApp = {
      init() {
        initThree();
        this.loadLocal();
        if (State.fishes.length === 0) {
          for (let i = 0; i < 3; i++) {
            State.fishes.push(new ProceduralFish());
          }
        }
        this.updateUI();

        // Boss / Stealth Key Binding (ESC)
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            State.isStealth = !State.isStealth;
            document.body.classList.toggle('stealth-hidden', State.isStealth);
          }
        });

        // Loop
        let lastTime = performance.now();
        const animate = () => {
          requestAnimationFrame(animate);
          const now = performance.now();
          const delta = (now - lastTime) / 1000;
          lastTime = now;

          // Fish Simulation
          State.fishes.forEach(f => f.update(delta));

          // Foods falling
          for (let i = State.foods.length - 1; i >= 0; i--) {
            const food = State.foods[i];
            food.pos.y -= delta * 0.6;
            food.mesh.position.copy(food.pos);
            if (food.pos.y < -tankBounds.y) {
              scene.remove(food.mesh);
              State.foods.splice(i, 1);
            }
          }

          // Natural breeding ticker (Every ~15 seconds test)
          if (Math.random() < delta * 0.08) {
            attemptBreeding();
          }

          // Cleanliness decay
          State.cleanliness = Math.max(10, State.cleanliness - delta * 0.15);

          // Auction Tick
          AuctionEngine.tick(delta);

          renderer.render(scene, camera);
        };
        animate();

        // Auto Save interval (every 10s)
        setInterval(() => this.saveLocal(), 10000);
      },

      feedFish() {
        Sound.init();
        Sound.bubble();
        for (let i = 0; i < 4; i++) {
          const foodGeo = new THREE.SphereGeometry(0.06, 8, 8);
          const foodMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
          const mesh = new THREE.Mesh(foodGeo, foodMat);
          const pos = new THREE.Vector3(
            (Math.random() - 0.5) * (tankBounds.x - 1),
            tankBounds.y - 0.2,
            (Math.random() - 0.5) * (tankBounds.z - 1)
          );
          mesh.position.copy(pos);
          scene.add(mesh);
          State.foods.push({ mesh, pos });
        }
      },

      consumeFood(food) {
        const idx = State.foods.indexOf(food);
        if (idx > -1) {
          scene.remove(food.mesh);
          State.foods.splice(idx, 1);
        }
      },

      cleanTank() {
        Sound.init();
        Sound.bubble();
        State.cleanliness = 100;
        this.updateUI();
      },

      buyStarterFish() {
        if (State.money < 5000) {
          alert("자산이 부족합니다!");
          return;
        }
        if (State.fishes.length >= State.tankCapacity) {
          alert("수조 용량이 가득 찼습니다!");
          return;
        }
        Sound.init();
        Sound.coin();
        State.money -= 5000;
        State.fishes.push(new ProceduralFish());
        this.updateUI();
      },

      toggleWidgetMode() {
        State.isWidgetMode = !State.isWidgetMode;
        document.body.classList.toggle('mode-widget', State.isWidgetMode);

        // Document Picture-in-Picture API Trigger (if supported by Chrome/Edge)
        if (window.documentPictureInPicture && State.isWidgetMode) {
          console.log("Document PiP available for true desktop detachment.");
        }
      },

      openAuctionModal() {
        this.renderAuctionView();
        document.getElementById('auction-modal').classList.add('active');
      },

      renderAuctionView() {
        const container = document.getElementById('active-auction-container');
        const list = document.getElementById('auction-fish-list');

        // Render Active Auction
        if (State.activeAuction) {
          const auc = State.activeAuction;
          container.innerHTML = `
            <div class="auction-active-card">
              <span class="bid-timer">남은 시간: ${Math.max(0, Math.ceil(auc.timeLeft))}초</span>
              <div style="font-size: 15px; font-weight: 700; color: #f59e0b;">${auc.fish.gene.name}</div>
              <div style="font-size: 12px; color: #94a3b8;">등급: ${auc.fish.tier} | 최고 입찰자: ${auc.highestBidder}</div>
              <div style="font-size: 20px; font-weight: 800; color: #38bdf8; margin: 8px 0;">
                현재 호가: ₩ ${auc.currentBid.toLocaleString()}
              </div>
              <div class="bid-log">
                ${auc.logs.map(log => `<div>${log}</div>`).join('')}
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `<div style="padding: 14px; text-align: center; color: #64748b; font-size: 13px;">현재 진행 중인 경매가 없습니다. 아래에서 성어를 출품하세요.</div>`;
        }

        // Render adult fish available
        const adults = State.fishes.filter(f => f.age >= 90);
        list.innerHTML = '';
        if (adults.length === 0) {
          list.innerHTML = `<div style="font-size: 13px; color: #64748b;">출품 가능한 성어가 없습니다. 치어를 먼저 키워주세요.</div>`;
          return;
        }

        adults.forEach(f => {
          const div = document.createElement('div');
          div.className = 'fish-card';
          div.innerHTML = `
            <div>
              <div style="font-weight: 700; font-size: 14px;">${f.gene.name}</div>
              <div style="display: flex; gap: 6px; margin-top: 4px;">
                <span class="fish-badge-tier tier-${f.tier.toLowerCase()}">${f.tier}</span>
                <span style="font-size: 12px; color: #94a3b8;">평가액: ₩${f.baseValue.toLocaleString()}</span>
              </div>
            </div>
            <button class="btn-glass btn-gold" ${State.activeAuction ? 'disabled' : ''} onclick="AquaApp.submitToAuction('${f.id}')">
              경매 출품
            </button>
          `;
          list.appendChild(div);
        });
      },

      submitToAuction(fishId) {
        const fish = State.fishes.find(f => f.id === fishId);
        if (fish) {
          AuctionEngine.startAuction(fish);
        }
      },

      openSyncModal() {
        const payload = this.serializeState();
        const encoded = btoa(encodeURIComponent(payload));
        document.getElementById('sync-export-code').innerText = encoded;
        document.getElementById('sync-modal').classList.add('active');
      },

      copySyncCode() {
        const text = document.getElementById('sync-export-code').innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert("동기화 코드가 클립보드에 복사되었습니다!\n다른 기기나 모바일에서 붙여넣으세요.");
        });
      },

      importSyncCode() {
        const input = document.getElementById('sync-import-code').value.trim();
        if (!input) return;
        try {
          const decoded = decodeURIComponent(atob(input));
          this.deserializeState(decoded);
          alert("데이터 동기화 완료! 수조가 성공적으로 복원되었습니다.");
          this.closeModal('sync-modal');
        } catch (e) {
          alert("유효하지 않은 동기화 코드입니다.");
        }
      },

      closeModal(id) {
        document.getElementById(id).classList.remove('active');
      },

      updateUI() {
        document.getElementById('stat-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('stat-fish-count').innerText = `${State.fishes.length} / ${State.tankCapacity}`;
        document.getElementById('stat-clean').innerText = `${Math.round(State.cleanliness)}%`;

        document.getElementById('widget-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('widget-status').innerText = `수질 ${Math.round(State.cleanliness)}%`;
      },

      serializeState() {
        return JSON.stringify({
          money: State.money,
          tankCapacity: State.tankCapacity,
          cleanliness: State.cleanliness,
          fishes: State.fishes.map(f => ({
            age: f.age,
            hunger: f.hunger,
            gene: f.gene
          }))
        });
      },

      deserializeState(jsonString) {
        const data = JSON.parse(jsonString);
        State.money = data.money || 25000;
        State.tankCapacity = data.tankCapacity || 6;
        State.cleanliness = data.cleanliness || 100;

        // Clear existing 3D fishes
        State.fishes.forEach(f => f.destroy());
        State.fishes = [];

        // Reconstruct
        if (data.fishes) {
          data.fishes.forEach(fData => {
            const fish = new ProceduralFish(fData.gene);
            fish.age = fData.age;
            fish.hunger = fData.hunger;
            State.fishes.push(fish);
          });
        }
        this.updateUI();
        this.saveLocal();
      },

      saveLocal() {
        localStorage.setItem('aqua_save_v1', this.serializeState());
      },

      loadLocal() {
        const raw = localStorage.getItem('aqua_save_v1');
        if (raw) {
          try {
            this.deserializeState(raw);
          } catch (e) {
            console.error("Local save load failed", e);
          }
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      AquaApp.init();
    });
  </script>
</body>
