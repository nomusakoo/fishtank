<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <title>AquaBreeder Tycoon - Stable Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.85); --border-glass: rgba(255, 255, 255, 0.15);
      --accent-cyan: #06b6d4; --accent-gold: #f59e0b; --accent-purple: #8b5cf6;
      --accent-red: #ef4444; --accent-green: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #050b14; color: var(--text-main); }
    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .interactive { pointer-events: auto; }

    /* Header */
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .stat-badge { background: var(--bg-glass); backdrop-filter: blur(8px); border: 1px solid var(--border-glass); border-radius: 12px; padding: 8px 16px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; }
    .stat-badge span.val { color: var(--accent-cyan); font-weight: 700; }
    .badge-gold span.val { color: var(--accent-gold); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    /* Buttons */
    button.btn-glass { background: var(--bg-glass); backdrop-filter: blur(8px); border: 1px solid var(--border-glass); color: white; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: 0.15s; }
    button.btn-glass:hover:not(:disabled) { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
    button.btn-glass:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-primary { background: linear-gradient(135deg, #0284c7, #06b6d4); border: none; }
    button.btn-gold { background: linear-gradient(135deg, #d97706, #f59e0b); border: none; }
    button.btn-green { background: linear-gradient(135deg, #059669, #10b981); border: none; }
    button.btn-purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); border: none; }

    .bottom-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .main-action-btn { padding: 12px 24px; font-size: 15px; border-radius: 14px; }

    /* Modals (팝업) */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: rgba(15,23,42,0.95); border: 1px solid var(--border-glass); border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 700; margin: 0; }
    .modal-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    /* Tabs (경매장/판매 분리) */
    .tab-header { display: flex; gap: 8px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px; margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border-glass); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .tab-btn.active { background: var(--accent-cyan); color: #fff; border-color: var(--accent-cyan); }
    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 10px; }

    /* Fish & Shop Items */
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid transparent; }
    .list-item:hover { background: rgba(255,255,255,0.1); border-color: var(--border-glass); }

    /* Breeding UI */
    .breed-slot-container { display: flex; justify-content: space-between; gap: 12px; text-align: center; }
    .breed-slot { flex: 1; padding: 16px 10px; background: rgba(0,0,0,0.3); border: 1px dashed var(--border-glass); border-radius: 12px; cursor: pointer; }
    .breed-slot:hover { border-color: var(--accent-purple); }
    .prediction-box { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; color: var(--text-muted); }

    /* Build Mode */
    #build-overlay { display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid var(--accent-green); padding: 10px 20px; border-radius: 20px; z-index: 50; color: var(--accent-green); font-weight: bold; pointer-events: none; text-align: center; }
    #deco-edit-banner { display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid var(--accent-purple); padding: 12px 20px; border-radius: 16px; z-index: 50; color: #fff; text-align: center; font-size: 13px; }
    #deco-edit-banner button { margin-top: 6px; }

    /* Utility Colors */
    .tier-Common { color: #cbd5e1; } .tier-Rare { color: #38bdf8; } .tier-Epic { color: #d8b4fe; } .tier-Legendary { color: #fde047; font-weight: bold; }
    .cond-text { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .num-input { width: 90px; padding: 8px; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.3); color: #fff; }

    /* Responsive / mobile tuning */
    @media (max-width: 600px) {
      .main-action-btn { padding: 10px 14px; font-size: 13px; border-radius: 12px; }
      .bottom-bar { gap: 6px; }
      .stat-badge { padding: 6px 10px; font-size: 12px; }
      .header-bar button.btn-glass { padding: 6px 10px; font-size: 12px; }
      .modal-card { max-width: 100%; max-height: 90vh; }
    }
    @media (max-width: 400px) {
      .bottom-bar { flex-wrap: wrap; }
      .main-action-btn { flex: 1 1 40%; justify-content: center; }
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer" id="ui-layer">
    <header class="header-bar interactive">
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="stat-badge badge-gold"><span>자산:</span><span class="val" id="stat-money">₩ 25,000</span></div>
        <div class="stat-badge"><span>어항:</span><span class="val" id="stat-fish-count">0 / 8</span></div>
      </div>
      <div class="header-actions">
        <button class="btn-glass btn-gold" onclick="AquaApp.openTradeModal()">⚖️ 거래소</button>
        <button class="btn-glass" onclick="FishListUI.open()">📋 도감</button>
        <button class="btn-glass" onclick="AquaApp.confirmResetGame()">🔄 새로하기</button>
      </div>
    </header>

    <footer class="bottom-bar interactive" id="bottom-bar">
      <button class="btn-glass btn-primary main-action-btn" onclick="AquaApp.feedFish()">🍚 밥 주기</button>
      <button class="btn-glass main-action-btn" onclick="AquaApp.openBuyModal()">➕ 치어 구매</button>
      <button class="btn-glass btn-purple main-action-btn" onclick="BreedingUI.open()">🧪 부화장 (교배)</button>
      <button class="btn-glass btn-green main-action-btn" onclick="AquaApp.openShopModal()">🛒 인테리어 상점</button>
    </footer>
  </div>

  <div id="build-overlay">원하는 위치를 클릭해 설치하세요.<br>(우클릭: 취소)</div>
  <div id="deco-edit-banner"></div>

  <!-- TRADE MODAL (판매 / 경매 탭) -->
  <div class="modal-overlay interactive" id="trade-modal" onclick="AquaApp.closeOutside(event, 'trade-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚖️ 거래소</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('trade-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="tab-header">
          <button class="tab-btn active" id="tab-btn-sell" onclick="AquaApp.switchTab('sell')">즉시 판매</button>
          <button class="tab-btn" id="tab-btn-auction" onclick="AquaApp.switchTab('auction')">실시간 경매</button>
        </div>

        <!-- 즉시 판매 탭 -->
        <div class="tab-content active" id="tab-sell-content"></div>

        <!-- 경매장 탭 -->
        <div class="tab-content" id="tab-auction-content"></div>
      </div>
    </div>
  </div>

  <!-- BREEDING MODAL -->
  <div class="modal-overlay interactive" id="breeding-modal" onclick="AquaApp.closeOutside(event, 'breeding-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🧪 지정 교배 부화장</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('breeding-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="breed-slot-container">
          <div class="breed-slot" id="slot-1" onclick="BreedingUI.selectParent(1)">➕ 부모 1 선택</div>
          <div class="breed-slot" id="slot-2" onclick="BreedingUI.selectParent(2)">➕ 부모 2 선택</div>
        </div>
        <div id="breed-select-list" style="display:none; max-height:120px; overflow-y:auto; border:1px solid var(--border-glass); border-radius:8px; padding:8px;"></div>
        <div class="prediction-box" id="breed-prediction">부모를 모두 선택하면 유전학 리포트가 생성됩니다.</div>
        <button class="btn-glass btn-purple" id="btn-breed" disabled style="padding:12px; font-size:15px; justify-content:center;" onclick="BreedingUI.execute()">
          🧬 교배 진행 (비용: ₩3,000)
        </button>
      </div>
    </div>
  </div>

  <!-- SHOP MODAL -->
  <div class="modal-overlay interactive" id="shop-modal" onclick="AquaApp.closeOutside(event, 'shop-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🛒 아쿠아 상점</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('shop-modal')">✕</button>
      </div>
      <div class="modal-body">
        <button class="btn-glass btn-purple" onclick="DecoEditor.toggle()">🛠 배치 편집 모드 (이동/제거)</button>
        <div id="shop-list"></div>
      </div>
    </div>
  </div>

  <!-- FISH INFO MODAL -->
  <div class="modal-overlay interactive" id="fish-info-modal" onclick="AquaApp.closeOutside(event, 'fish-info-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🐟 물고기 정보</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('fish-info-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-size:12px; color:var(--text-muted);">이름</label>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="text" id="fish-info-name" class="num-input" style="flex:1; width:auto;">
            <button class="btn-glass btn-primary" onclick="FishInfoUI.saveName()">저장</button>
          </div>
        </div>
        <div class="prediction-box">
          종류: <span id="fish-info-species"></span><br>
          나이: <span id="fish-info-age"></span><br>
          상태(컨디션): <span id="fish-info-condition"></span><br>
          출품 시 예상 가격: <span id="fish-info-price"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- FISH LIST MODAL -->
  <div class="modal-overlay interactive" id="fish-list-modal" onclick="AquaApp.closeOutside(event, 'fish-list-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📋 물고기 도감</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('fish-list-modal')">✕</button>
      </div>
      <div class="modal-body" id="fish-list-content"></div>
    </div>
  </div>

  <!-- BUY MODAL -->
  <div class="modal-overlay interactive" id="buy-modal" onclick="AquaApp.closeOutside(event, 'buy-modal')">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🐟 치어 구매</h3>
        <button class="btn-glass" onclick="AquaApp.closeModal('buy-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; align-items:center; gap:10px;">
          <label style="flex:1;">구매 수량</label>
          <input type="number" id="buy-qty" class="num-input" min="1" value="1" oninput="AquaApp.updateBuyPreview()">
        </div>
        <div class="prediction-box" id="buy-summary"></div>
        <button class="btn-glass btn-primary" style="padding:12px; justify-content:center;" onclick="AquaApp.confirmBulkBuy()">구매하기 (마리당 ₩5,000)</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. GAME STATE & AUDIO
       ========================================================== */
    const SAVE_KEY = 'aqua_save_v5';
    const LEGACY_SAVE_KEY = 'aqua_save_v4';

    const State = {
      money: 35000, tankCapacity: 8, fishes: [], foods: [], decorations: [],
      floorStyle: 'default', bgStyle: 'default', auction: null
    };

    const Sound = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      play(f1, f2, type='sine', dur=0.1, vol=0.1) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f1, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime + dur);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur + 0.05);
      },
      bubble() { this.play(400, 800, 'sine', 0.1); },
      coin() { this.play(987, 1318, 'triangle', 0.2); },
      magic() { this.play(600, 1200, 'sine', 0.4); },
      thud() { this.play(150, 50, 'square', 0.1, 0.2); }
    };

    /* ==========================================================
       2. THREE.JS SCENE SETUP
       ========================================================== */
    let scene, camera, renderer, sandMesh;
    let glassPanels = [], midPlane = null;
    const tankX = 6, tankY = 3.5, tankZ = 3.5;

    function randomTankPoint() {
      return new THREE.Vector3(
        (Math.random()-0.5)*(tankX*1.7),
        (Math.random()-0.5)*(tankY*1.7),
        (Math.random()-0.5)*(tankZ*1.7)
      );
    }

    function makeHungerSprite() {
      const mat = new THREE.SpriteMaterial({ transparent: true, depthWrite: false });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(0.32, 0.32, 0.32);
      return spr;
    }

    function sceneFindByDecoId(id) {
      let found = null;
      scene.traverse(o => { if (o.userData && o.userData.decoId === id) found = o; });
      return found;
    }

    const MATURITY_MS = 10 * 60 * 1000; // 10 minutes real-time to reach adulthood

    function formatDuration(ms) {
      if (ms <= 0) return '0초';
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m > 0 ? `${m}분 ${s}초` : `${s}초`;
    }

    const FLOOR_PALETTES = {
      default: { base: '#1e293b', speckles: ['#334155', '#0f172a', '#475569'] },
      white:   { base: '#e2e8f0', speckles: ['#cbd5e1', '#f8fafc', '#94a3b8'] },
      black:   { base: '#0a0a0a', speckles: ['#1f2937', '#000000', '#334155'] }
    };

    function makeGravelTexture(palette) {
      const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = palette.base; ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 350; i++) {
        const r = 3 + Math.random()*6;
        ctx.beginPath();
        ctx.fillStyle = palette.speckles[Math.floor(Math.random()*palette.speckles.length)];
        ctx.globalAlpha = 0.5 + Math.random()*0.5;
        ctx.arc(Math.random()*512, Math.random()*512, r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 3);
      return tex;
    }

    function applyFloorStyle(style) {
      if (!sandMesh) return;
      const palette = FLOOR_PALETTES[style] || FLOOR_PALETTES.default;
      sandMesh.material.map = makeGravelTexture(palette);
      sandMesh.material.color.set(0xffffff);
      sandMesh.material.needsUpdate = true;
    }

    const BG_PALETTES = {
      default: ['#0b1120', '#082f49'],
      reef: ['#083344', '#0e7490'],
      night: ['#020617', '#020617']
    };

    function makeBgTexture(colors) {
      const canvas = document.createElement('canvas'); canvas.width = 8; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 8, 512);
      return new THREE.CanvasTexture(canvas);
    }

    function applyBgStyle(style) {
      if (!scene) return;
      scene.background = makeBgTexture(BG_PALETTES[style] || BG_PALETTES.default);
    }

    function updateCameraFraming() {
      if (!camera) return;
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      // Pull the camera back on narrow/portrait (mobile) screens so the whole tank stays in view
      camera.position.z = aspect < 1 ? 16 + (1 - aspect) * 14 : 16;
      camera.updateProjectionMatrix();
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      updateCameraFraming();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 250));

    function initThree() {
      const canvas = document.getElementById('webgl-canvas');
      scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050b14, 0.02);
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
      camera.position.set(0, 2, 16);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraFraming();

      scene.add(new THREE.AmbientLight(0xcdeafe, 1.2));
      const light = new THREE.DirectionalLight(0xffffff, 1.0);
      light.position.set(5, 10, 5); scene.add(light);

      const shimmer = new THREE.PointLight(0xbae6fd, 0.6, 24);
      shimmer.position.set(0, tankY + 3, 0);
      scene.add(shimmer);
      window._shimmerLight = shimmer;

      // Sand / gravel floor (sized to exactly fill the tank interior, no overhang past the glass)
      sandMesh = new THREE.Mesh(new THREE.PlaneGeometry(tankX*2, tankZ*2).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
      sandMesh.position.y = -tankY; scene.add(sandMesh);

      // Glass panels (translucent walls, also used as wall-mount raycast targets)
      glassPanels = [];
      const glassMat = () => new THREE.MeshPhysicalMaterial({ color: 0xbfe9ff, transparent: true, opacity: 0.1, roughness: 0.05, metalness: 0, side: THREE.DoubleSide });
      const panelDefs = [
        { w: tankX*2, h: tankY*2, pos: [0, 0, tankZ], rot: [0, 0, 0] },
        { w: tankX*2, h: tankY*2, pos: [0, 0, -tankZ], rot: [0, Math.PI, 0] },
        { w: tankZ*2, h: tankY*2, pos: [tankX, 0, 0], rot: [0, -Math.PI/2, 0] },
        { w: tankZ*2, h: tankY*2, pos: [-tankX, 0, 0], rot: [0, Math.PI/2, 0] }
      ];
      panelDefs.forEach(pd => {
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(pd.w, pd.h), glassMat());
        panel.position.set(pd.pos[0], pd.pos[1], pd.pos[2]);
        panel.rotation.set(pd.rot[0], pd.rot[1], pd.rot[2]);
        panel.userData.isGlassWall = true;
        scene.add(panel); glassPanels.push(panel);
      });

      // Glass edges/seams
      const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(tankX*2, tankY*2, tankZ*2));
      scene.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 })));

      // Invisible mid-water plane for freely-floating decorations
      midPlane = new THREE.Mesh(new THREE.PlaneGeometry(tankX*2, tankZ*2).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ visible: false }));
      midPlane.position.y = 0;
      scene.add(midPlane);

      applyBgStyle(State.bgStyle);
      applyFloorStyle(State.floorStyle);
    }

    /* ==========================================================
       3. FISH SPECIES, GENETICS & GEOMETRY
       ========================================================== */
    const GENES = {
      BLUE: { hex: 0x38bdf8, name: "블루", tier: "Common", val: 5000, species: 'GUPPY' },
      RED: { hex: 0xf43f5e, name: "레드", tier: "Common", val: 5000, species: 'GUPPY' },
      GREEN: { hex: 0x10b981, name: "그린", tier: "Rare", val: 18000, species: 'TETRA' },
      GOLD: { hex: 0xfacc15, name: "골드", tier: "Epic", val: 45000, species: 'ANGEL' },
      MUTANT: { hex: 0xa855f7, name: "오로라(돌연변이)", tier: "Legendary", val: 150000, species: 'BETTA' }
    };

    const SPECIES = {
      GUPPY: { label: '구피', bodyScale: [0.28, 0.45, 0.9], finLength: 0.5, finHeight: 0.32, tailAngles: [-0.4, -0.15, 0.15, 0.4], dorsal: false },
      TETRA: { label: '테트라', bodyScale: [0.22, 0.55, 1.25], finLength: 0.45, finHeight: 0.4, tailAngles: [-0.3, 0.3], dorsal: false },
      ANGEL: { label: '엔젤피시', bodyScale: [0.14, 1.0, 0.8], finLength: 0.4, finHeight: 0.5, tailAngles: [-0.25, 0, 0.25], dorsal: true },
      BETTA: { label: '베타', bodyScale: [0.26, 0.5, 1.0], finLength: 0.75, finHeight: 0.55, tailAngles: [-0.5, -0.25, 0, 0.25, 0.5], dorsal: true }
    };

    class Fish {
      constructor(geneKey, restore) {
        restore = restore || {};
        this.id = restore.id || Math.random().toString(36).substr(2,9);
        this.geneKey = geneKey;
        const g = GENES[geneKey];
        const sp = SPECIES[g.species] || SPECIES.GUPPY;
        this.species = g.species;
        this.name = g.name + " " + sp.label;
        this.tier = g.tier; this.value = g.val;
        this.hunger = typeof restore.hunger === 'number' ? restore.hunger : 100;
        this.purchaseCost = typeof restore.purchaseCost === 'number' ? restore.purchaseCost : g.val;
        // Fish restored without a recorded birth time (older saves) are treated as already grown,
        // rather than surprising the player by making all their existing fish babies again.
        this.birthTime = typeof restore.birthTime === 'number' ? restore.birthTime : (Date.now() - MATURITY_MS);
        this.customName = restore.customName || null;
        this._lastHungerBucket = -1;
        this._animT = Math.random()*10;
        this.phase = Math.random()*Math.PI*2;

        this.group = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({
          color: g.hex, metalness: this.tier === 'Legendary'? 0.8:0.2,
          emissive: this.tier === 'Legendary'? g.hex:0x000000, emissiveIntensity: 0.3
        });
        const finMat = new THREE.MeshStandardMaterial({ color: g.hex, transparent: true, opacity: 0.55, side: THREE.DoubleSide, roughness: 0.6 });

        const [bx, by, bz] = sp.bodyScale;
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12).scale(bx, by, bz), bodyMat);
        this.group.add(body);

        if (sp.dorsal) {
          const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 3), finMat);
          dorsal.rotation.x = Math.PI/2;
          dorsal.position.set(0, 0.3*by*0.95, 0.05);
          this.group.add(dorsal);
        }

        this.tailGroup = new THREE.Group();
        sp.tailAngles.forEach(a => {
          const seg = new THREE.Mesh(new THREE.PlaneGeometry(sp.finHeight, sp.finLength), finMat);
          seg.rotation.x = Math.PI/2;
          seg.position.z = -sp.finLength/2;
          seg.rotation.y = a;
          this.tailGroup.add(seg);
        });
        this.tailGroup.position.z = -(0.3*bz + 0.05);
        this.group.add(this.tailGroup);

        this.finL = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.18), finMat);
        this.finL.position.set(0.3*bx*0.95, 0, 0.3*bz*0.2);
        this.finL.rotation.y = Math.PI/2;
        this.finL.rotation.z = 0.3;
        this.finR = this.finL.clone();
        this.finR.position.x = -0.3*bx*0.95;
        this.finR.rotation.z = -0.3;
        this.group.add(this.finL, this.finR);

        this.hungerSprite = makeHungerSprite();
        this.hungerSprite.position.set(0, 0.3*by*1.6 + 0.15, 0);
        this.group.add(this.hungerSprite);
        this._updateHungerSprite();

        this.pos = new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*4, (Math.random()-0.5)*5);
        this.vel = new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.01, (Math.random()-0.5)*0.02);
        this.maxSpeed = 0.025 + Math.random()*0.02;
        this.turnRate = 0.006 + Math.random()*0.004;
        this.wanderTarget = randomTankPoint();
        this.wanderTimer = 240 + Math.random()*240;

        this.group.userData.fishId = this.id;
        scene.add(this.group);
      }

      get displayName() { return this.customName || this.name; }
      get isAdult() { return (Date.now() - this.birthTime) >= MATURITY_MS; }

      _updateHungerSprite() {
        const bucket = Math.max(0, Math.min(9, Math.floor(this.hunger/10)));
        if (bucket === this._lastHungerBucket) return;
        this._lastHungerBucket = bucket;
        const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const pct = bucket/9;
        const r = Math.round(255*(1-pct)), gC = Math.round(200*pct + 40);
        const grad = ctx.createRadialGradient(16, 16, 2, 16, 16, 14);
        grad.addColorStop(0, `rgba(${r},${gC},60,0.9)`);
        grad.addColorStop(1, `rgba(${r},${gC},60,0)`);
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(16, 16, 14, 0, Math.PI*2); ctx.fill();
        if (this.hungerSprite.material.map) this.hungerSprite.material.map.dispose();
        const tex = new THREE.CanvasTexture(canvas);
        this.hungerSprite.material.map = tex; this.hungerSprite.material.needsUpdate = true;
        this.hungerSprite.visible = bucket < 9;
      }

      update(foods) {
        this.hunger = Math.max(0, this.hunger - 0.0015);
        this._updateHungerSprite();

        let targetFood = null;
        if (this.hunger < 95 && foods && foods.length > 0) {
          let nd = Infinity;
          foods.forEach(f => { const d = this.pos.distanceTo(f.mesh.position); if (d < nd) { nd = d; targetFood = f; } });
        }

        let desired;
        if (targetFood) {
          desired = new THREE.Vector3().subVectors(targetFood.mesh.position, this.pos);
          if (desired.lengthSq() < 0.0001) desired.set(0, 0, 1);
          desired.normalize().multiplyScalar(this.maxSpeed);
        } else {
          this.wanderTimer--;
          if (this.wanderTimer <= 0 || this.pos.distanceTo(this.wanderTarget) < 0.5) {
            this.wanderTarget = randomTankPoint();
            this.wanderTimer = 240 + Math.random()*240;
          }
          desired = new THREE.Vector3().subVectors(this.wanderTarget, this.pos).normalize().multiplyScalar(this.maxSpeed*0.55);
        }

        // Soft wall avoidance
        const margin = 1.0;
        const edgePush = (v, lim) => {
          const over = Math.abs(v) - (lim - margin);
          return over > 0 ? -Math.sign(v)*over*0.03 : 0;
        };
        desired.x += edgePush(this.pos.x, tankX);
        desired.y += edgePush(this.pos.y, tankY);
        desired.z += edgePush(this.pos.z, tankZ);

        const steer = new THREE.Vector3().subVectors(desired, this.vel);
        if (steer.length() > this.turnRate) steer.setLength(this.turnRate);
        this.vel.add(steer);
        if (this.vel.length() > this.maxSpeed) this.vel.setLength(this.maxSpeed);

        this.pos.add(this.vel);
        this.pos.x = THREE.MathUtils.clamp(this.pos.x, -tankX+0.3, tankX-0.3);
        this.pos.y = THREE.MathUtils.clamp(this.pos.y, -tankY+0.3, tankY-0.3);
        this.pos.z = THREE.MathUtils.clamp(this.pos.z, -tankZ+0.3, tankZ-0.3);
        this.group.position.copy(this.pos);

        if (this.vel.lengthSq() > 0.000001) {
          const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), this.vel.clone().normalize());
          this.group.quaternion.slerp(q, 0.08);
        }

        if (targetFood && this.pos.distanceTo(targetFood.mesh.position) < 0.5) {
          const idx = foods.indexOf(targetFood);
          if (idx > -1) {
            scene.remove(targetFood.mesh);
            foods.splice(idx, 1);
            this.hunger = Math.min(100, this.hunger + 35);
            Sound.bubble();
          }
        }

        const speed = this.vel.length();
        this._animT += 0.016;
        const swishSpeed = 6 + speed*40;
        this.tailGroup.rotation.y = Math.sin(this._animT*swishSpeed + this.phase) * 0.35;
        const finAmp = speed < 0.008 ? 0.32 : 0.12;
        this.finL.rotation.z = 0.3 + Math.sin(this._animT*4 + this.phase)*finAmp;
        this.finR.rotation.z = -0.3 - Math.sin(this._animT*4 + this.phase + Math.PI)*finAmp;
      }

      destroy() { scene.remove(this.group); }
    }

    /* ==========================================================
       4. BREEDING UI SYSTEM
       ========================================================== */
    const BreedingUI = {
      p1: null, p2: null, active: 0,
      open() {
        this.p1 = null; this.p2 = null;
        document.getElementById('slot-1').innerText = "➕ 부모 1 선택";
        document.getElementById('slot-2').innerText = "➕ 부모 2 선택";
        document.getElementById('breed-prediction').innerText = "부모를 선택하세요.";
        document.getElementById('btn-breed').disabled = true;
        document.getElementById('breed-select-list').style.display = 'none';
        AquaApp.openModal('breeding-modal');
      },
      selectParent(slot) {
        this.active = slot;
        const list = document.getElementById('breed-select-list');
        list.style.display = 'block';
        list.innerHTML = State.fishes.filter(f => f !== this.p1 && f !== this.p2).map(f =>
          `<div class="list-item" style="padding:6px; margin-bottom:4px; cursor:pointer;" onclick="BreedingUI.confirmFish('${f.id}')">
            <span class="tier-${f.tier}">${f.displayName}</span>
          </div>`
        ).join('') || `<div style="text-align:center; color:#94a3b8;">가능한 개체가 없습니다.</div>`;
      },
      confirmFish(id) {
        const fish = State.fishes.find(f => f.id === id);
        if(this.active === 1) { this.p1 = fish; document.getElementById('slot-1').innerHTML = `<b class="tier-${fish.tier}">${fish.displayName}</b>`; }
        else { this.p2 = fish; document.getElementById('slot-2').innerHTML = `<b class="tier-${fish.tier}">${fish.displayName}</b>`; }
        document.getElementById('breed-select-list').style.display = 'none';

        if(this.p1 && this.p2) {
          document.getElementById('btn-breed').disabled = false;
          let mutRate = (this.p1.tier==='Epic' || this.p2.tier==='Epic') ? 25 : 10;
          document.getElementById('breed-prediction').innerHTML = `
            <span style="color:var(--accent-cyan)">유전학 리포트</span><br>
            유전 형질 계승 확률: ${100 - mutRate}%<br>
            <span style="color:var(--accent-gold)">돌연변이 발생 확률: ${mutRate}%</span>
          `;
        }
      },
      execute() {
        if(State.money < 3000) return alert("비용이 부족합니다.");
        if(State.fishes.length >= State.tankCapacity) return alert("수용량이 꽉 찼습니다.");

        State.money -= 3000; Sound.init(); Sound.magic();
        let mutRate = (this.p1.tier==='Epic' || this.p2.tier==='Epic') ? 25 : 10;
        let childGene;
        if(Math.random()*100 < mutRate) {
          const r = Math.random();
          childGene = r<0.2 ? 'MUTANT' : (r<0.5 ? 'GOLD' : 'GREEN');
        } else {
          childGene = Math.random()>0.5 ? this.p1.geneKey : this.p2.geneKey;
        }

        const baby = new Fish(childGene, { purchaseCost: 3000, birthTime: Date.now() });
        baby.pos.copy(this.p1.pos);
        State.fishes.push(baby);
        AquaApp.updateUI(); AquaApp.saveLocal();
        alert(`🎉 교배 성공!\n[${baby.name}] 탄생!`);
        AquaApp.closeModal('breeding-modal');
      }
    };

    const SHOP_DB = [
      { id: 'plant', name: '나나 수초', price: 2000, type: 'deco', surface: 'floor' },
      { id: 'rock', name: '청룡석', price: 5000, type: 'deco', surface: 'floor' },
      { id: 'driftwood', name: '유목', price: 7000, type: 'deco', surface: 'floor' },
      { id: 'coral', name: '산호 군락', price: 9000, type: 'deco', surface: 'floor' },
      { id: 'castle', name: '수중 성', price: 15000, type: 'deco', surface: 'floor' },
      { id: 'bubbler', name: '버블러', price: 4000, type: 'deco', surface: 'floor' },
      { id: 'wallplant', name: '벽면 이끼', price: 3000, type: 'deco', surface: 'wall' },
      { id: 'hanging', name: '부유 장식볼', price: 3500, type: 'deco', surface: 'floating' },
      { id: 'floor-white', name: '흰 모래 바닥재', price: 6000, type: 'floor-style', styleId: 'white' },
      { id: 'floor-black', name: '블랙 사막 바닥재', price: 6000, type: 'floor-style', styleId: 'black' },
      { id: 'bg-reef', name: '산호초 배경', price: 8000, type: 'bg-style', styleId: 'reef' },
      { id: 'bg-night', name: '심해 야간 배경', price: 8000, type: 'bg-style', styleId: 'night' },
      { id: 'upgrade', name: '수조 크기 확장 (+5)', price: 30000, type: 'up' }
    ];

    function createDeco(type) {
      if(type==='plant') return new THREE.Mesh(new THREE.ConeGeometry(0.3,1.5,5).translate(0,0.75,0), new THREE.MeshStandardMaterial({color:0x10b981}));
      if(type==='rock') return new THREE.Mesh(new THREE.DodecahedronGeometry(0.8).translate(0,0.4,0), new THREE.MeshStandardMaterial({color:0x64748b}));
      if(type==='driftwood') {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.22,1.8,6).translate(0,0.9,0), new THREE.MeshStandardMaterial({color:0x5b3a29, roughness:1}));
        trunk.rotation.z = 0.5;
        g.add(trunk);
        return g;
      }
      if(type==='coral') {
        const g = new THREE.Group();
        const colors = [0xf472b6, 0xfb923c, 0xa78bfa];
        for(let i=0;i<4;i++){
          const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2+Math.random()*0.15,0), new THREE.MeshStandardMaterial({color:colors[i%colors.length]}));
          m.position.set((Math.random()-0.5)*0.6, 0.2+Math.random()*0.3, (Math.random()-0.5)*0.6);
          g.add(m);
        }
        return g;
      }
      if(type==='castle') {
        const g = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.2,10), new THREE.MeshStandardMaterial({color:0x94a3b8})); base.position.y=0.6;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.6,0.6,10), new THREE.MeshStandardMaterial({color:0x475569})); roof.position.y=1.5;
        g.add(base, roof);
        return g;
      }
      if(type==='bubbler') {
        const g = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.2,8), new THREE.MeshStandardMaterial({color:0x1e293b}));
        g.add(base);
        g.userData.isBubbler = true;
        g.userData.bubbles = [];
        for(let i=0;i<6;i++){
          const b = new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6), new THREE.MeshBasicMaterial({color:0xbae6fd, transparent:true, opacity:0.6}));
          b.position.set((Math.random()-0.5)*0.15, Math.random()*tankY*2, (Math.random()-0.5)*0.15);
          g.add(b); g.userData.bubbles.push(b);
        }
        return g;
      }
      if(type==='wallplant') return new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5), new THREE.MeshStandardMaterial({color:0x22c55e, side:THREE.DoubleSide, transparent:true, opacity:0.85}));
      if(type==='hanging') return new THREE.Mesh(new THREE.SphereGeometry(0.15,10,10), new THREE.MeshStandardMaterial({color:0xf59e0b, emissive:0xf59e0b, emissiveIntensity:0.3}));
      return new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshStandardMaterial({color:0xffffff}));
    }

    function updateDecorations() {
      scene.traverse(o => {
        if (o.userData && o.userData.isBubbler) {
          o.userData.bubbles.forEach(b => {
            b.position.y += 0.03;
            if (b.position.y > tankY*2 - 0.5) b.position.y = 0;
          });
        }
      });
    }

    const Builder = {
      active: false, item: null, reuseId: null, ghost: null, ray: new THREE.Raycaster(), mouse: new THREE.Vector2(),
      start(item, reuseId) {
        AquaApp.closeModal('shop-modal');
        this.active = true; this.item = item; this.reuseId = reuseId || null;
        this.ghost = createDeco(item.id);
        this.ghost.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.5; if (o.material.emissive) o.material.emissive.setHex(0x10b981); } });
        scene.add(this.ghost);
        const overlay = document.getElementById('build-overlay');
        overlay.innerHTML = this.reuseId ? '새 위치를 클릭해 이동하세요.<br>(우클릭: 취소)' : '원하는 위치를 클릭해 설치하세요.<br>(우클릭: 취소)';
        overlay.style.display = 'block';
        document.getElementById('ui-layer').style.pointerEvents = 'none';
      },
      move(e) {
        if(!this.active) return;
        this.mouse.x = (e.clientX/window.innerWidth)*2-1; this.mouse.y = -(e.clientY/window.innerHeight)*2+1;
        this.ray.setFromCamera(this.mouse, camera);
        let targets = [sandMesh];
        if (this.item.surface === 'wall') targets = glassPanels;
        else if (this.item.surface === 'floating') targets = [midPlane];
        const hits = this.ray.intersectObjects(targets);
        if(hits.length>0) {
          this.ghost.position.copy(hits[0].point);
          if (this.item.surface === 'wall' && hits[0].face) {
            const n = hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld);
            this.ghost.lookAt(this.ghost.position.clone().add(n));
          }
        }
      },
      click(e) {
        if(!this.active) return;
        if(e.button===2) { this.cancel(); return; } // Right click cancel
        if(!this.reuseId && State.money < this.item.price) { alert("잔액 부족"); this.cancel(); return; }

        Sound.init(); Sound.thud();
        let data;
        if (this.reuseId) {
          const old = sceneFindByDecoId(this.reuseId);
          if (old) scene.remove(old);
          data = State.decorations.find(d => d.id === this.reuseId);
          data.x = this.ghost.position.x; data.y = this.ghost.position.y; data.z = this.ghost.position.z; data.rotationY = this.ghost.rotation.y;
        } else {
          State.money -= this.item.price;
          data = { id: Math.random().toString(36).substr(2,9), type: this.item.id, x: this.ghost.position.x, y: this.ghost.position.y, z: this.ghost.position.z, surface: this.item.surface||'floor', rotationY: this.ghost.rotation.y };
          State.decorations.push(data);
        }
        this.spawn(data);
        this.cancel(); AquaApp.saveLocal(); AquaApp.updateUI();
      },
      spawn(data) {
        const item = SHOP_DB.find(i=>i.id===data.type);
        const m = createDeco(data.type);
        m.position.set(data.x, data.y!==undefined ? data.y : -tankY, data.z);
        m.rotation.y = data.rotationY || 0;
        m.userData.decoId = data.id;
        m.userData.decoName = item ? item.name : data.type;
        scene.add(m);
      },
      cancel() {
        this.active = false; scene.remove(this.ghost); this.ghost=null; this.reuseId = null;
        document.getElementById('build-overlay').style.display = 'none';
        document.getElementById('ui-layer').style.pointerEvents = 'none';
        AquaApp.updateUI();
      }
    };
    window.addEventListener('mousemove', e=>Builder.move(e));
    window.addEventListener('mousedown', e=>{
      if(Builder.active) { Builder.click(e); return; }
      if(DecoEditor.active) { DecoEditor.pick(e); }
    });
    window.addEventListener('contextmenu', e=>{ if(Builder.active) e.preventDefault(); });

    const DecoEditor = {
      active: false, selected: null,
      toggle() {
        this.active = !this.active;
        this.selected = null;
        const banner = document.getElementById('deco-edit-banner');
        if (this.active) {
          banner.style.display = 'block';
          banner.innerHTML = '편집 모드: 장식물을 클릭해 선택하세요. (ESC로 종료)';
          AquaApp.closeModal('shop-modal');
        } else {
          banner.style.display = 'none';
        }
      },
      pick(e) {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const ray = new THREE.Raycaster();
        ray.setFromCamera(mouse, camera);
        const targets = [];
        scene.traverse(o => { if (o.userData && o.userData.decoId) targets.push(o); });
        const hits = ray.intersectObjects(targets, true);
        if (hits.length === 0) return;
        let obj = hits[0].object;
        while (obj && !obj.userData.decoId) obj = obj.parent;
        if (!obj) return;
        this.selected = obj.userData.decoId;
        document.getElementById('deco-edit-banner').innerHTML = `선택됨: ${obj.userData.decoName || '장식물'}<br>
          <button class="btn-glass btn-purple" onclick="DecoEditor.move()">이동</button>
          <button class="btn-glass" style="background:var(--accent-red)" onclick="DecoEditor.remove()">제거</button>
          <button class="btn-glass" onclick="DecoEditor.cancelSelect()">취소</button>`;
      },
      cancelSelect() {
        this.selected = null;
        document.getElementById('deco-edit-banner').innerHTML = '편집 모드: 장식물을 클릭해 선택하세요. (ESC로 종료)';
      },
      move() {
        const data = State.decorations.find(d=>d.id===this.selected);
        if (!data) return;
        const item = SHOP_DB.find(i=>i.id===data.type);
        this.active = false;
        document.getElementById('deco-edit-banner').style.display = 'none';
        Builder.start(item, data.id);
      },
      remove() {
        const idx = State.decorations.findIndex(d=>d.id===this.selected);
        if (idx===-1) return;
        const old = sceneFindByDecoId(this.selected);
        if (old) scene.remove(old);
        State.decorations.splice(idx,1);
        AquaApp.saveLocal();
        this.cancelSelect();
      }
    };

    /* ==========================================================
       6. FISH INFO / LIST UI
       ========================================================== */
    const FishInfoUI = {
      currentId: null, _interval: null,
      open(id) {
        const f = State.fishes.find(x => x.id === id);
        if (!f) return;
        this.currentId = id;
        this.render(f);
        AquaApp.openModal('fish-info-modal');
        this._ensureTimer();
      },
      render(f) {
        document.getElementById('fish-info-name').value = f.displayName;
        const spLabel = SPECIES[f.species] ? SPECIES[f.species].label : f.species;
        document.getElementById('fish-info-species').innerHTML = `<span class="tier-${f.tier}">${f.tier}</span> · ${spLabel}`;
        const elapsed = Date.now() - f.birthTime;
        const stage = f.isAdult ? '성체' : '치어';
        const remain = Math.max(0, MATURITY_MS - elapsed);
        document.getElementById('fish-info-age').innerHTML = `${stage} (경과 ${formatDuration(elapsed)})` + (f.isAdult ? '' : ` · 성체까지 ${formatDuration(remain)}`);
        document.getElementById('fish-info-condition').innerText = `${Math.round(f.hunger)}%`;
        document.getElementById('fish-info-price').innerText = `₩${f.value.toLocaleString()}`;
      },
      saveName() {
        const f = State.fishes.find(x => x.id === this.currentId);
        if (!f) return;
        const val = document.getElementById('fish-info-name').value.trim();
        f.customName = (val && val !== f.name) ? val : null;
        AquaApp.saveLocal();
        FishListUI.renderIfOpen();
      },
      _ensureTimer() {
        if (this._interval) return;
        this._interval = setInterval(() => {
          const modal = document.getElementById('fish-info-modal');
          const f = State.fishes.find(x => x.id === this.currentId);
          if (!modal.classList.contains('active') || !f) { clearInterval(this._interval); this._interval = null; return; }
          this.render(f);
        }, 1000);
      }
    };

    const FishListUI = {
      render() {
        const c = document.getElementById('fish-list-content');
        if (State.fishes.length === 0) { c.innerHTML = '<div style="text-align:center; color:#94a3b8;">어항에 물고기가 없습니다.</div>'; return; }
        c.innerHTML = State.fishes.map(f => {
          const stage = f.isAdult ? '성체' : '치어';
          return `<div class="list-item" style="cursor:pointer;" onclick="FishListUI.openDetail('${f.id}')">
            <div>
              <span class="tier-${f.tier}">${f.displayName}</span>
              <div class="cond-text">${stage} · 컨디션 ${Math.round(f.hunger)}%</div>
            </div>
            <span style="color:var(--text-muted); font-size:12px;">₩${f.value.toLocaleString()}</span>
          </div>`;
        }).join('');
      },
      open() {
        this.render();
        AquaApp.openModal('fish-list-modal');
      },
      openDetail(id) {
        AquaApp.closeModal('fish-list-modal');
        FishInfoUI.open(id);
      },
      renderIfOpen() {
        if (document.getElementById('fish-list-modal').classList.contains('active')) this.render();
      }
    };

    // Click a fish in the tank to open its info popup (ignored while placing/editing decorations)
    window.addEventListener('click', e => {
      if (Builder.active || DecoEditor.active) return;
      if (e.target.id !== 'webgl-canvas') return;
      const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
      const ray = new THREE.Raycaster();
      ray.setFromCamera(mouse, camera);
      const hits = ray.intersectObjects(State.fishes.map(f => f.group), true);
      if (hits.length === 0) return;
      let obj = hits[0].object;
      while (obj && !obj.userData.fishId) obj = obj.parent;
      if (obj) FishInfoUI.open(obj.userData.fishId);
    });

    /* ==========================================================
       7. AUCTION SYSTEM
       ========================================================== */
    const AUCTION_ELIGIBLE_TIERS = ['Rare', 'Epic', 'Legendary'];
    const AuctionUI = {
      bidTimeout: null, tickInterval: null,

      render() {
        const c = document.getElementById('tab-auction-content');
        if (!c) return;
        if (!State.auction) {
          const eligible = State.fishes.filter(f => AUCTION_ELIGIBLE_TIERS.includes(f.tier));
          c.innerHTML = eligible.length === 0
            ? `<div style="text-align:center; padding:20px; color:var(--text-muted);">희귀(Rare) 등급 이상 물고기만 출품할 수 있습니다.</div>`
            : eligible.map(f => `
              <div class="list-item">
                <span class="tier-${f.tier}">${f.displayName}</span>
                <button class="btn-glass btn-purple" onclick="AuctionUI.list('${f.id}')">출품 (시작가 ₩${f.value.toLocaleString()})</button>
              </div>`).join('');
          return;
        }
        const a = State.auction;
        const remain = Math.max(0, a.endsAt - Date.now());
        const mm = String(Math.floor(remain/60000)).padStart(2,'0');
        const ss = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
        c.innerHTML = `
          <div class="prediction-box">
            <b class="tier-${a.fishSnapshot.tier}">${a.fishSnapshot.name}</b> 경매 진행 중<br>
            현재 최고가: <span style="color:var(--accent-gold)">₩${a.currentBid.toLocaleString()}</span> ${a.bidder==='npc' ? '(NPC 입찰)' : '(입찰 대기 중)'}<br>
            남은 시간: <span id="auction-timer">${mm}:${ss}</span>
          </div>
          ${a.bidder ? `<button class="btn-glass btn-gold" style="padding:12px; justify-content:center;" onclick="AuctionUI.resolve()">₩${a.currentBid.toLocaleString()}에 즉시 낙찰 수락</button>` : `<div style="text-align:center; color:var(--text-muted); font-size:12px;">아직 입찰이 없습니다. 잠시 기다려보세요...</div>`}
          <div style="max-height:80px; overflow-y:auto; font-size:12px; color:var(--text-muted);">
            ${a.history.slice().reverse().map(h=>`NPC 입찰: ₩${h.amount.toLocaleString()}`).join('<br>') || '입찰 기록 없음'}
          </div>
        `;
        this._ensureTimer();
      },

      list(fishId) {
        const idx = State.fishes.findIndex(f=>f.id===fishId);
        if (idx===-1) return;
        const f = State.fishes[idx];
        if (!AUCTION_ELIGIBLE_TIERS.includes(f.tier)) return;
        f.destroy();
        State.fishes.splice(idx,1);
        State.auction = {
          fishSnapshot: { geneKey: f.geneKey, hunger: f.hunger, purchaseCost: f.purchaseCost, name: f.displayName, tier: f.tier, birthTime: f.birthTime, customName: f.customName },
          currentBid: f.value, bidder: null,
          history: [], endsAt: Date.now() + 60000
        };
        AquaApp.updateUI(); AquaApp.saveLocal();
        this.render(); this._startNpcBidding();
      },

      _startNpcBidding() {
        clearTimeout(this.bidTimeout);
        const scheduleNext = () => {
          if (!State.auction) return;
          const delay = 4000 + Math.random()*4000;
          this.bidTimeout = setTimeout(() => {
            if (!State.auction) return;
            if (Date.now() >= State.auction.endsAt) return;
            if (Math.random() < 0.7) {
              const inc = 1.05 + Math.random()*0.15;
              State.auction.currentBid = Math.round(State.auction.currentBid * inc);
              State.auction.bidder = 'npc';
              State.auction.history.push({ bidder: 'npc', amount: State.auction.currentBid, t: Date.now() });
              if (State.auction.endsAt - Date.now() < 10000) State.auction.endsAt = Date.now() + 10000;
              Sound.coin();
              AquaApp.saveLocal();
              this.render();
            }
            scheduleNext();
          }, delay);
        };
        scheduleNext();
      },

      _ensureTimer() {
        if (this.tickInterval) return;
        this.tickInterval = setInterval(() => {
          if (!State.auction) { clearInterval(this.tickInterval); this.tickInterval = null; return; }
          if (Date.now() >= State.auction.endsAt) { this.resolve(); return; }
          const el = document.getElementById('auction-timer');
          if (el) {
            const remain = Math.max(0, State.auction.endsAt - Date.now());
            const mm = String(Math.floor(remain/60000)).padStart(2,'0');
            const ss = String(Math.floor((remain%60000)/1000)).padStart(2,'0');
            el.innerText = `${mm}:${ss}`;
          }
        }, 500);
      },

      resolve() {
        const a = State.auction;
        if (!a) return;
        clearTimeout(this.bidTimeout); this.bidTimeout = null;
        if (this.tickInterval) { clearInterval(this.tickInterval); this.tickInterval = null; }
        if (a.bidder === 'npc') {
          State.money += a.currentBid;
          Sound.coin();
          alert(`🎉 경매 낙찰! ₩${a.currentBid.toLocaleString()} 획득!`);
        } else {
          State.fishes.push(new Fish(a.fishSnapshot.geneKey, { hunger: a.fishSnapshot.hunger, purchaseCost: a.fishSnapshot.purchaseCost, birthTime: a.fishSnapshot.birthTime, customName: a.fishSnapshot.customName }));
          alert('입찰자가 없어 유찰되었습니다. 물고기가 반환됩니다.');
        }
        State.auction = null;
        AquaApp.updateUI(); AquaApp.saveLocal();
        this.render();
      },

      resume() {
        if (!State.auction) return;
        if (Date.now() >= State.auction.endsAt) {
          this.resolve();
        } else {
          this._startNpcBidding();
        }
        this.render();
      }
    };

    /* ==========================================================
       8. MAIN APP CONTROLLER (Save/Load/UI)
       ========================================================== */
    const AquaApp = {
      init() {
        initThree(); this.loadLocal();
        if(State.fishes.length===0 && !State.auction) { State.fishes.push(new Fish('BLUE', { birthTime: Date.now() }), new Fish('RED', { birthTime: Date.now() })); }
        State.decorations.forEach(d => Builder.spawn(d));
        this.updateUI();
        AuctionUI.resume();

        const animate = () => {
          requestAnimationFrame(animate);
          State.fishes.forEach(f => f.update(State.foods));

          for(let i=State.foods.length-1; i>=0; i--) {
             const food = State.foods[i];
             food.vy = Math.max(food.vy - 0.0025, -0.02);
             food.mesh.position.y += food.vy;
             food.mesh.position.x += Math.sin(Date.now()*0.002 + food.driftPhase)*0.004;
             food.mesh.position.z += Math.cos(Date.now()*0.0017 + food.driftPhase)*0.004;
             if(food.mesh.position.y < -tankY) {
               scene.remove(food.mesh);
               State.foods.splice(i,1);
             }
          }

          updateDecorations();
          if (window._shimmerLight) window._shimmerLight.intensity = 0.6 + Math.sin(Date.now()*0.0005)*0.15;

          renderer.render(scene, camera);
        };
        animate();

        // ESC Key to close modals/build/edit modes
        window.addEventListener('keydown', e => {
           if(e.key === 'Escape') {
              if(Builder.active) Builder.cancel();
              if(DecoEditor.active) { DecoEditor.active = false; document.getElementById('deco-edit-banner').style.display = 'none'; }
              document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
           }
        });

        // Auto Save
        setInterval(() => this.saveLocal(), 5000);
      },

      feedFish() {
        Sound.init(); Sound.bubble();
        for(let i=0; i<3; i++) {
          const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({color:0xf59e0b}));
          mesh.position.set((Math.random()-0.5)*8, tankY-0.3, (Math.random()-0.5)*4);
          scene.add(mesh);
          State.foods.push({ mesh, vy: 0, driftPhase: Math.random()*Math.PI*2 });
        }
      },

      /* Bulk starter fish purchase */
      openBuyModal() {
        const capacityLeft = State.tankCapacity - State.fishes.length;
        const maxAffordable = Math.floor(State.money/5000);
        document.getElementById('buy-qty').value = Math.max(1, Math.min(maxAffordable, capacityLeft) || 1);
        this.updateBuyPreview();
        this.openModal('buy-modal');
      },
      updateBuyPreview() {
        const qty = parseInt(document.getElementById('buy-qty').value) || 0;
        const capacityLeft = State.tankCapacity - State.fishes.length;
        const maxAffordable = Math.floor(State.money/5000);
        const actual = Math.max(0, Math.min(qty, capacityLeft, maxAffordable));
        let warn = '';
        if (qty > actual) warn = `<br><span style="color:var(--accent-red)">자금/수용량 한도로 ${actual}마리만 구매 가능합니다.</span>`;
        document.getElementById('buy-summary').innerHTML = `총 비용: ₩${(actual*5000).toLocaleString()} · 남은 자리: ${capacityLeft}${warn}`;
      },
      confirmBulkBuy() {
        const qty = parseInt(document.getElementById('buy-qty').value) || 0;
        const capacityLeft = State.tankCapacity - State.fishes.length;
        const maxAffordable = Math.floor(State.money/5000);
        const actual = Math.max(0, Math.min(qty, capacityLeft, maxAffordable));
        if (actual <= 0) { alert('구매할 수 없습니다. 자금 또는 수조 여유를 확인하세요.'); return; }
        Sound.init(); Sound.coin();
        for (let i=0; i<actual; i++) {
          State.money -= 5000;
          State.fishes.push(new Fish(Math.random()>0.5 ? 'BLUE':'RED', { purchaseCost: 5000, birthTime: Date.now() }));
        }
        this.updateUI(); this.saveLocal(); this.closeModal('buy-modal');
      },

      /* UI & Modals */
      openModal(id) { document.getElementById(id).classList.add('active'); },
      openTradeModal() {
        this.renderSellList();
        AuctionUI.render();
        document.getElementById('trade-modal').classList.add('active');
      },
      openShopModal() {
        const list = document.getElementById('shop-list');
        list.innerHTML = SHOP_DB.map(i => `
          <div class="list-item">
            <div><b>${i.name}</b></div>
            <button class="btn-glass btn-green" onclick="AquaApp.buyShop('${i.id}')">₩${i.price.toLocaleString()}</button>
          </div>
        `).join('');
        document.getElementById('shop-modal').classList.add('active');
      },
      closeModal(id) { document.getElementById(id).classList.remove('active'); },
      closeOutside(e, id) { if(e.target.id === id) this.closeModal(id); },

      buyShop(id) {
        const item = SHOP_DB.find(i=>i.id===id);
        if(State.money < item.price) return alert("잔액 부족!");
        if(item.type==='up') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.tankCapacity+=5;
          alert("수조 용량 증가!"); this.updateUI(); this.saveLocal();
        } else if(item.type==='floor-style') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.floorStyle = item.styleId;
          applyFloorStyle(State.floorStyle); this.updateUI(); this.saveLocal(); this.closeModal('shop-modal');
        } else if(item.type==='bg-style') {
          Sound.init(); Sound.coin(); State.money-=item.price; State.bgStyle = item.styleId;
          applyBgStyle(State.bgStyle); this.updateUI(); this.saveLocal(); this.closeModal('shop-modal');
        } else {
          Builder.start(item);
        }
      },

      /* Tabs Logic */
      switchTab(tab) {
        document.getElementById('tab-btn-sell').classList.toggle('active', tab==='sell');
        document.getElementById('tab-btn-auction').classList.toggle('active', tab==='auction');
        document.getElementById('tab-sell-content').classList.toggle('active', tab==='sell');
        document.getElementById('tab-auction-content').classList.toggle('active', tab==='auction');
        if (tab === 'auction') AuctionUI.render();
      },
      conditionFactor(fish) { return 0.6 + 0.2 * (fish.hunger/100); },
      renderSellList() {
        const c = document.getElementById('tab-sell-content');
        if(State.fishes.length===0) { c.innerHTML = '<div style="text-align:center; color:#94a3b8;">판매할 물고기가 없습니다.</div>'; return; }
        c.innerHTML = State.fishes.map(f => {
          const price = Math.round(f.purchaseCost * this.conditionFactor(f));
          return `
          <div class="list-item">
            <div>
              <span class="tier-${f.tier}">${f.displayName}</span>
              <div class="cond-text">컨디션: ${Math.round(f.hunger)}%</div>
            </div>
            <button class="btn-glass btn-gold" onclick="AquaApp.sellFish('${f.id}')">₩${price.toLocaleString()} 판매</button>
          </div>`;
        }).join('');
      },
      sellFish(id) {
        const idx = State.fishes.findIndex(f=>f.id===id);
        if(idx > -1) {
           const f = State.fishes[idx];
           const price = Math.round(f.purchaseCost * this.conditionFactor(f));
           Sound.init(); Sound.coin();
           State.money += price;
           f.destroy();
           State.fishes.splice(idx,1);
           this.updateUI(); this.renderSellList(); this.saveLocal();
        }
      },

      updateUI() {
        document.getElementById('stat-money').innerText = `₩ ${State.money.toLocaleString()}`;
        document.getElementById('stat-fish-count').innerText = `${State.fishes.length} / ${State.tankCapacity}`;
      },

      /* Robust Save/Load with v4 -> v5 migration */
      saveLocal() {
        const data = {
          version: 5,
          money: State.money, tankCapacity: State.tankCapacity,
          fishes: State.fishes.map(f => ({ geneKey: f.geneKey, hunger: f.hunger, purchaseCost: f.purchaseCost, id: f.id, birthTime: f.birthTime, customName: f.customName })),
          decorations: State.decorations,
          floorStyle: State.floorStyle,
          bgStyle: State.bgStyle,
          auction: State.auction
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      },
      loadLocal() {
        let data = null;
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          try { data = JSON.parse(raw); } catch(e) { console.error("Save load failed", e); }
        } else {
          const legacy = localStorage.getItem(LEGACY_SAVE_KEY);
          if (legacy) {
            try {
              const d = JSON.parse(legacy);
              data = {
                money: d.money, tankCapacity: d.tankCapacity,
                fishes: (d.fishes||[]).map(gene => ({ geneKey: gene, hunger: 100, purchaseCost: GENES[gene] ? GENES[gene].val : 5000 })),
                decorations: (d.decorations||[]).map(dec => ({ ...dec, id: Math.random().toString(36).substr(2,9), surface: 'floor', rotationY: 0 })),
                floorStyle: 'default', bgStyle: 'default', auction: null
              };
            } catch(e) { console.error("Legacy save load failed", e); }
          }
        }
        if (!data) return;
        State.money = data.money || 35000;
        State.tankCapacity = data.tankCapacity || 8;
        State.decorations = data.decorations || [];
        State.floorStyle = data.floorStyle || 'default';
        State.bgStyle = data.bgStyle || 'default';
        State.auction = data.auction || null;
        if (data.fishes && data.fishes.length>0) {
          data.fishes.forEach(fd => State.fishes.push(new Fish(fd.geneKey, fd)));
        }
      },

      confirmResetGame() {
        if (confirm('정말 게임을 처음부터 새로 시작할까요?\n현재 진행 상황(자산, 물고기, 인테리어)이 모두 사라지며 되돌릴 수 없습니다.')) {
          this.resetGame();
        }
      },
      resetGame() {
        clearTimeout(AuctionUI.bidTimeout); AuctionUI.bidTimeout = null;
        if (AuctionUI.tickInterval) { clearInterval(AuctionUI.tickInterval); AuctionUI.tickInterval = null; }

        State.fishes.forEach(f => f.destroy());
        State.fishes = [];
        State.foods.forEach(f => scene.remove(f.mesh));
        State.foods = [];
        State.decorations.forEach(d => { const m = sceneFindByDecoId(d.id); if (m) scene.remove(m); });
        State.decorations = [];
        State.money = 35000;
        State.tankCapacity = 8;
        State.floorStyle = 'default';
        State.bgStyle = 'default';
        State.auction = null;

        applyFloorStyle(State.floorStyle);
        applyBgStyle(State.bgStyle);

        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(LEGACY_SAVE_KEY);

        State.fishes.push(new Fish('BLUE', { birthTime: Date.now() }), new Fish('RED', { birthTime: Date.now() }));
        this.updateUI();
        this.saveLocal();
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      }
    };
    window.addEventListener('DOMContentLoaded', () => AquaApp.init());
  </script>
</body>
</html>
